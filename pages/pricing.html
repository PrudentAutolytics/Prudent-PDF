<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Pricing</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
/* ── Billing toggle ── */
.toggle-wrap {
  display:inline-flex; align-items:center; gap:4px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:999px; padding:4px;
}
.toggle-btn {
  padding:7px 18px; border-radius:999px;
  font-size:13px; font-weight:600; cursor:pointer;
  border:none; background:transparent; color:var(--ink3);
  font-family:var(--font); transition:all .15s;
}
.toggle-btn.active { background:var(--blue); color:#fff; box-shadow:0 2px 8px rgba(37,99,235,.3); }
.save-pill { background:var(--green); color:#fff; font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:999px; vertical-align:middle; margin-left:3px; }

/* ── Plan cards ── */
.plans-grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  margin-bottom:32px;
}
@media(max-width:1100px){ .plans-grid { grid-template-columns:repeat(3,1fr); } }
@media(max-width:720px) { .plans-grid { grid-template-columns:1fr 1fr; } }
@media(max-width:480px) { .plans-grid { grid-template-columns:1fr; } }

.plan-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--r16); padding:22px 18px;
  display:flex; flex-direction:column;
  position:relative; transition:all .18s;
}
.plan-card:hover { border-color:var(--border2); box-shadow:var(--s3); transform:translateY(-2px); }
.plan-card.popular { border-color:var(--blue); box-shadow:0 0 0 3px rgba(46,117,182,.12); }

.popular-pill {
  position:absolute; top:-12px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:#fff; font-size:10.5px; font-weight:700;
  padding:3px 14px; border-radius:999px; white-space:nowrap;
}

.plan-name { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); margin-bottom:10px; }
.plan-price-wrap { display:flex; align-items:baseline; gap:3px; margin-bottom:2px; }
.plan-price-num { font-size:34px; font-weight:900; letter-spacing:-1.5px; color:var(--ink); font-family:var(--display); }
.plan-price-per { font-size:12px; color:var(--ink3); }
.plan-annual-note { font-size:11px; color:var(--green); font-weight:600; min-height:16px; margin-bottom:12px; }
.plan-desc { font-size:12.5px; color:var(--ink3); line-height:1.6; margin-bottom:16px; flex:1; }

.plan-btn {
  display:block; text-align:center; padding:9px 14px;
  border-radius:var(--r8); font-size:13px; font-weight:700;
  text-decoration:none; transition:all .15s; margin-bottom:16px;
  border:none; cursor:pointer; font-family:var(--font);
}
.plan-btn.primary {
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:#fff; box-shadow:0 3px 12px rgba(37,99,235,.35);
}
.plan-btn.primary:hover { transform:translateY(-1px); box-shadow:0 5px 16px rgba(37,99,235,.45); }
.plan-btn.ghost {
  background:var(--surface2); border:1.5px solid var(--border2); color:var(--ink2);
}
.plan-btn.ghost:hover { border-color:var(--blue); color:var(--blue); }

.plan-sep { height:1px; background:var(--border); margin:0 0 14px; }

.plan-limits { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
.plan-limit-row { display:flex; justify-content:space-between; font-size:11.5px; }
.plan-limit-label { color:var(--ink3); }
.plan-limit-val { font-weight:700; color:var(--ink); font-family:var(--mono); font-size:11px; }

.plan-features { display:flex; flex-direction:column; gap:6px; }
.plan-feat { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink2); }
.plan-feat svg { flex-shrink:0; }
.plan-feat.off { color:var(--ink4); }
.plan-feat.off svg { color:var(--border2); }

/* ── Cost calculator ── */
.calc-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r16); padding:28px 32px; margin-bottom:32px; }
.calc-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; }
.calc-title { font-size:17px; font-weight:800; letter-spacing:-.3px; color:var(--ink); margin-bottom:4px; }
.calc-sub { font-size:13px; color:var(--ink3); line-height:1.6; }
.calc-result-pill { background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff; border-radius:var(--r12); padding:16px 20px; text-align:center; min-width:160px; flex-shrink:0; }
.calc-result-label { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.8; margin-bottom:4px; }
.calc-result-price { font-size:32px; font-weight:900; letter-spacing:-1px; font-family:var(--display); }
.calc-result-sub { font-size:11px; opacity:.75; margin-top:2px; }
.calc-fields { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media(max-width:720px){ .calc-fields { grid-template-columns:1fr 1fr; } }
.calc-breakdown-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
.calc-item { background:var(--surface2); border:1px solid var(--border); border-radius:var(--r8); padding:10px 12px; text-align:center; }
.calc-item-label { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin-bottom:4px; }
.calc-item-val { font-size:17px; font-weight:800; font-family:var(--display); color:var(--ink); }
.compare-table .cx { color:var(--red); }
.compare-table .ck { color:var(--green); }

/* ── Comparison table ── */
.compare-wrap { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r16); overflow:hidden; margin-bottom:32px; }
.compare-table { width:100%; border-collapse:collapse; }
.compare-table th { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); padding:12px 16px; border-bottom:2px solid var(--border); background:var(--surface2); text-align:left; }
.compare-table th:not(:first-child) { text-align:center; }
.compare-table td { padding:11px 16px; border-bottom:1px solid var(--border); font-size:13px; color:var(--ink2); }
.compare-table td:not(:first-child) { text-align:center; font-weight:600; color:var(--ink); }
.compare-table tr:last-child td { border-bottom:none; }
.compare-table tr:hover td { background:var(--surface2); }
.compare-table .hi { background:rgba(37,99,235,.03); }
.ck { color:var(--green); font-size:15px; }
.cx { color:var(--border2); font-size:15px; }

/* ── FAQ ── */
.faq-list { display:flex; flex-direction:column; }
.faq-item { border-bottom:1px solid var(--border); }
.faq-item:last-child { border-bottom:none; }
.faq-q { display:flex; justify-content:space-between; align-items:center; padding:16px 0; cursor:pointer; font-size:14px; font-weight:600; color:var(--ink); gap:12px; user-select:none; }
.faq-q:hover { color:var(--blue); }
.faq-q-icon { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:grid; place-items:center; color:var(--ink3); transition:all .2s; }
.faq-q-icon svg { transition:transform .2s ease; }
.faq-q.open .faq-q-icon svg { transform:rotate(180deg); }
.faq-q.open .faq-q-icon { background:var(--blue); border-color:var(--blue); color:#fff; }
.faq-a { font-size:13.5px; color:var(--ink3); line-height:1.75; padding-bottom:16px; display:none; }
.faq-a.open { display:block; }
</style>
</head>
<body>
<div id="pricingShell" style="min-height:100vh;background:var(--page-bg)">
  <div class="shell" id="appShell">
    <main class="main" id="pricingMain" style="opacity:0;transition:opacity .2s">
      Loading…
    </main>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/shell.js"></script>
<script>
(function(){
  'use strict';

  if (!Session.valid()) { location.replace('/login'); return; }

  Shell.init('pricing');

  var main = document.getElementById('pricingMain');
  if (!main) return;

  var s = Session.get() || {};

  /* ── Build full page HTML synchronously ── */
  var PLAN_ORDER = ['trial','starter','professional','business','enterprise'];
  var isAnnual   = false;

  function planRows() {
    return PLAN_ORDER.map(function(id) {
      var p = APP_CONFIG.PLANS[id];
      if (!p) return '';
      var price    = isAnnual ? Math.round(p.price * 0.8) : p.price;
      var priceStr = price === 0 ? 'Free' : '$' + price;
      var perStr   = price === 0 ? '' : '<span style="font-size:14px;font-weight:500;color:var(--ink3)">/mo</span>';
      var annStr   = (isAnnual && price > 0) ? '<div style="font-size:11px;color:var(--green);font-weight:600;margin-top:2px">$' + (Math.round(p.price*0.8)*12) + '/yr</div>' : '<div style="height:16px"></div>';
      var isCurrent = s.plan === id;
      var isPopular = id === 'professional';
      var href      = (id === 'business' || id === 'enterprise') ? '/contact' : '/login';
      var btnTxt    = isCurrent ? 'Current plan' : (price === 0 ? 'Get started free' : 'Get started');
      var btnCls    = isPopular ? 'plan-btn primary' : 'plan-btn ghost';
      var pill      = isPopular ? '<div class="popular-pill">\u2b50 Most Popular</div>' : '';
      var curBadge  = isCurrent ? '<div style="font-size:11px;color:var(--green);font-weight:600;text-align:center;margin-top:6px">\u2713 Your plan</div>' : '';
      return '<div class="plan-card' + (isPopular?' popular':'') + '" id="pc-'+id+'">' + pill +
        '<div class="plan-name">' + p.label + '</div>' +
        '<div style="display:flex;align-items:baseline;gap:2px;margin:12px 0 0">' +
          '<span style="font-size:36px;font-weight:900;letter-spacing:-1.5px;font-family:var(--display);color:var(--ink)" id="pp-'+id+'">' + priceStr + '</span>' + perStr +
        '</div>' +
        '<div id="pa-'+id+'">' + annStr + '</div>' +
        '<a href="' + href + '" class="' + btnCls + '" style="display:block;text-align:center;padding:9px 14px;margin:14px 0">' + btnTxt + '</a>' +
        curBadge +
        '<div class="plan-sep"></div>' +
        '<div class="plan-limits">' +
          '<div class="plan-limit-row"><span class="plan-limit-label">Files / month</span><span class="plan-limit-val">' + (p.filesPerMonth===999999?'Unlimited':p.filesPerMonth) + '</span></div>' +
          '<div class="plan-limit-row"><span class="plan-limit-label">Max file size</span><span class="plan-limit-val">' + p.maxFileSizeMB + ' MB</span></div>' +
          '<div class="plan-limit-row"><span class="plan-limit-label">Pages / file</span><span class="plan-limit-val">' + (p.maxPagesPerFile===99999?'Unlimited':p.maxPagesPerFile) + '</span></div>' +
        '</div>' +
        '</div>';
    }).join('');
  }

  function updatePrices() {
    PLAN_ORDER.forEach(function(id) {
      var p = APP_CONFIG.PLANS[id]; if (!p) return;
      var price    = isAnnual ? Math.round(p.price * 0.8) : p.price;
      var priceStr = price === 0 ? 'Free' : '$' + price;
      var pp = document.getElementById('pp-'+id);
      var pa = document.getElementById('pa-'+id);
      if (pp) pp.textContent = priceStr;
      if (pa) pa.innerHTML = (isAnnual && price > 0)
        ? '<div style="font-size:11px;color:var(--green);font-weight:600;margin-top:2px">$' + (Math.round(p.price*0.8)*12) + '/yr \u2014 save $' + ((p.price-Math.round(p.price*0.8))*12) + '</div>'
        : '<div style="height:16px"></div>';
    });
  }

  var compareRows = [
    ['Azure Doc Intelligence',    true,  true,  true,  true,  true ],
    ['Side-by-side viewer',       true,  true,  true,  true,  true ],
    ['Secure Azure Blob storage', true,  true,  true,  true,  true ],
    ['CSV field export',          false, true,  true,  true,  true ],
    ['Priority processing',       false, false, true,  true,  true ],
    ['Confidence score reports',  false, false, true,  true,  true ],
    ['API access',                false, false, false, true,  true ],
    ['Custom redaction rules',    false, false, false, true,  true ],
    ['SLA guarantee',             false, false, false, true,  true ],
    ['SharePoint integration',    false, false, false, false, true ],
    ['Custom Azure deployment',   false, false, false, false, true ],
    ['Dedicated account manager', false, false, false, false, true ],
  ];

  var compareHtml = '<div style="overflow-x:auto"><table class="compare-table"><thead><tr>' +
    '<th>Feature</th><th>Trial</th><th>Starter</th><th class="hi">Professional</th><th>Business</th><th>Enterprise</th>' +
    '</tr></thead><tbody>' +
    compareRows.map(function(r) {
      return '<tr><td>' + r[0] + '</td>' +
        r.slice(1).map(function(v, i) {
          return '<td' + (i===2?' class="hi"':'') + '>' + (v?'<span class="ck">\u2713</span>':'<span class="cx">\u2717</span>') + '</td>';
        }).join('') + '</tr>';
    }).join('') +
    '</tbody></table></div>';

  var faqs = [
    ['How is pricing calculated?','Pricing uses real Azure Document Intelligence costs \u2014 $1.50 per 1,000 pages for OCR and $10 per 1,000 pages for PII detection. We add 20% overhead and a 3.5\u00d7 margin. Per page: ~$0.043.'],
    ['Is my data secure?','All files are stored in private Azure Blob Storage with SAS-based access only. Files are automatically deleted after 7 days. We never store document content permanently.'],
    ['Can I cancel anytime?','Yes. No long-term contracts. Cancel or downgrade at any time. Annual plans are non-refundable after the first 14 days.'],
    ['Do you offer enterprise plans?','Yes. For organisations with specific requirements, contact us and we\u2019ll put together a custom proposal within 48 hours.'],
  ];

  main.innerHTML = [
    '<div class="page-hd anim">',
      '<div>',
        '<div class="page-hd-eyebrow">Plans &amp; Pricing</div>',
        '<div class="page-title">Simple, transparent pricing</div>',
        '<div class="page-subtitle">Powered by Azure Document Intelligence. No hidden fees. Cancel anytime.</div>',
      '</div>',
    '</div>',

    /* Billing toggle */
    '<div style="display:flex;justify-content:center;margin-bottom:28px">',
      '<div class="toggle-group">',
        '<button class="toggle-btn active" id="tgMonthly">Monthly</button>',
        '<button class="toggle-btn" id="tgAnnual">Annual <span class="save-pill">Save 20%</span></button>',
      '</div>',
    '</div>',

    /* Plan cards */
    '<div class="plans-grid anim d1" id="plansGrid">' + planRows() + '</div>',

    /* Calculator */
    '<div class="calc-card anim d2">',
      '<div class="calc-header">',
        '<div>',
          '<div class="calc-title">Estimate your cost</div>',
          '<div class="calc-sub">Based on real Azure pricing \u2014 OCR ($1.50/1k pages) + PII detection ($10/1k pages) + 3.5\u00d7 margin.</div>',
          '<div class="calc-fields" style="margin-top:18px">',
            '<div class="form-group" style="margin:0"><label class="form-label">Documents / month</label><input class="form-input" type="number" id="calcDocs" value="100" min="1"/></div>',
            '<div class="form-group" style="margin:0"><label class="form-label">Avg pages / doc</label><input class="form-input" type="number" id="calcPages" value="10" min="1"/></div>',
            '<div class="form-group" style="margin:0"><label class="form-label">Avg file size (MB)</label><input class="form-input" type="number" id="calcSizeMB" value="2" min="0.1" step="0.5"/></div>',
            '<div class="form-group" style="margin:0"><label class="form-label">Billing period</label><select class="form-select" id="calcPeriod"><option value="monthly">Monthly</option><option value="annual">Annual (\u221220%)</option></select></div>',
          '</div>',
          '<div class="calc-breakdown-row">',
            '<div class="calc-item"><div class="calc-item-label">Azure OCR</div><div class="calc-item-val" id="calcOcr">$0.00</div></div>',
            '<div class="calc-item"><div class="calc-item-label">PII Detection</div><div class="calc-item-val" id="calcPii">$0.00</div></div>',
            '<div class="calc-item"><div class="calc-item-label">Infrastructure</div><div class="calc-item-val" id="calcInfra">$0.00</div></div>',
          '</div>',
        '</div>',
        '<div class="calc-result-pill">',
          '<div class="calc-result-label">Est. monthly cost</div>',
          '<div class="calc-result-price" id="calcPrice">$0.00</div>',
          '<div class="calc-result-sub" id="calcSub">\u2014</div>',
          '<div id="calcRec" style="margin-top:10px;font-size:11px;font-weight:600;line-height:1.5;opacity:.95"></div>',
        '</div>',
      '</div>',
    '</div>',

    /* Compare table */
    '<div class="card anim d3" style="margin-bottom:32px;overflow:hidden">',
      '<div class="card-hd"><div class="card-title">Feature comparison</div></div>',
      compareHtml,
    '</div>',

    /* FAQ */
    '<div class="faq-wrap anim d4">',
      faqs.map(function(f) {
        return '<div class="faq-item">' +
          '<button class="faq-q">' + f[0] + '<span class="faq-q-icon">\u203a</span></button>' +
          '<div class="faq-a"><p>' + f[1] + '</p></div>' +
          '</div>';
      }).join(''),
    '</div>',
  ].join('');

  /* Show content */
  main.style.opacity = '1';
  document.title = 'Pricing';

  /* Billing toggle */
  document.getElementById('tgMonthly')?.addEventListener('click', function() {
    isAnnual = false;
    document.getElementById('tgMonthly').classList.add('active');
    document.getElementById('tgAnnual').classList.remove('active');
    updatePrices();
  });
  document.getElementById('tgAnnual')?.addEventListener('click', function() {
    isAnnual = true;
    document.getElementById('tgAnnual').classList.add('active');
    document.getElementById('tgMonthly').classList.remove('active');
    updatePrices();
  });

  /* Calculator */
  function calcEstimate() {
    var docs   = Math.max(1, +(document.getElementById('calcDocs').value)   || 100);
    var pages  = Math.max(1, +(document.getElementById('calcPages').value)  || 10);
    var sizeMB = Math.max(.1,+(document.getElementById('calcSizeMB').value) || 2);
    var annual = document.getElementById('calcPeriod').value === 'annual';
    var tp = docs * pages;
    var ocr   = tp * 0.0015;
    var pii   = tp * 0.010;
    var infra = (docs*sizeMB*0.00002)+(docs*0.0012)+(docs*0.000006)+(docs*0.00014);
    var azure = (ocr+pii+infra)*1.20;
    var prod  = azure*3.5*(annual?0.8:1);
    var f2 = function(n){return '$'+n.toFixed(2);};
    var ge = function(id){return document.getElementById(id);};
    if(ge('calcPrice')) ge('calcPrice').textContent = f2(prod);
    if(ge('calcOcr'))   ge('calcOcr').textContent   = f2(ocr);
    if(ge('calcPii'))   ge('calcPii').textContent   = f2(pii);
    if(ge('calcInfra')) ge('calcInfra').textContent = f2(infra*1.2);
    if(ge('calcSub'))   ge('calcSub').textContent   = docs.toLocaleString()+' docs \u00d7 '+pages+' pages'+(annual?' \u00b7 Annual':'');
    var planList = PLAN_ORDER.map(function(id){ return {id:id, p:APP_CONFIG.PLANS[id]}; });
    var rec = planList.find(function(x){ return x.p && (x.p.filesPerMonth===999999||x.p.filesPerMonth>=docs); }) || planList[planList.length-1];
    if (rec && ge('calcRec')) ge('calcRec').innerHTML = rec.p.price===0
      ? '\u2713 Fits <strong>Free Trial</strong> \u2014 <a href="/login" style="color:#fff;font-weight:700;text-decoration:underline">Get started \u2192</a>'
      : '\u2713 Recommended: <strong>'+rec.p.label+'</strong> ($'+rec.p.price+'/mo) \u2014 <a href="'+(rec.id==='business'||rec.id==='enterprise'?'/contact':'/login')+'" style="color:#fff;font-weight:700;text-decoration:underline">Get started \u2192</a>';
  }

  ['calcDocs','calcPages','calcSizeMB','calcPeriod'].forEach(function(id) {
    document.getElementById(id)?.addEventListener('input', calcEstimate);
  });
  calcEstimate();

  /* FAQ accordion */
  document.querySelectorAll('.faq-q').forEach(function(q) {
    q.addEventListener('click', function() {
      var a    = q.nextElementSibling;
      var open = a.classList.contains('open');
      document.querySelectorAll('.faq-a').forEach(function(x){x.classList.remove('open');});
      document.querySelectorAll('.faq-q').forEach(function(x){x.classList.remove('open');});
      if (!open) { a.classList.add('open'); q.classList.add('open'); }
    });
  });

})();
</script>

</html>
