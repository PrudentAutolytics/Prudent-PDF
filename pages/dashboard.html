/* REPLACE THE ENTIRE <script> block in dashboard.html with this */
(function () {
  'use strict';

  Shell.init('dashboard');

  const session = Session.get();
  const $ = id => document.getElementById(id);

  /* ── Welcome greeting ── */
  const greetEl = $('welcomeTitle');
  if (greetEl && session?.email) {
    const local = session.email.split('@')[0];
    const name  = local.replace(/[._-]+/g, ' ')
      .replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
    greetEl.textContent = `${greeting()}, ${name} 👋`;
  }

  /* ── Job history helpers ── */
  const JOB_KEY = `pp_jobs_${session?.userId || session?.email || 'anon'}`;

  function loadJobs() {
    try { return JSON.parse(localStorage.getItem(JOB_KEY) || '[]'); } catch { return []; }
  }

  function saveJob(job) {
    try {
      const jobs = [job, ...loadJobs().filter(j => j.jobId !== job.jobId)].slice(0, APP_CONFIG.APP.MAX_JOB_HISTORY);
      localStorage.setItem(JOB_KEY, JSON.stringify(jobs));
    } catch {}
  }

  function updateJob(jobId, patch) {
    try {
      const jobs = loadJobs().map(j => j.jobId === jobId ? { ...j, ...patch } : j);
      localStorage.setItem(JOB_KEY, JSON.stringify(jobs));
    } catch {}
  }

  /* ── Stats ── */
  function renderStats() {
    const jobs  = loadJobs();
    const s     = Session.get() || {};
    const used  = s.creditsUsed  ?? 0;
    const limit = s.creditsLimit ?? APP_CONFIG.TRIAL.MAX_FILES;
    const done  = jobs.filter(j => (j.status || '').toLowerCase() === 'complete');
    const total = jobs.length;
    const cost  = done.reduce((sum, j) => sum + (j.costTotal || 0), 0);
    const pages = done.reduce((sum, j) => sum + (j.pageCount || 0), 0);
    const avgCst = done.length ? cost / done.length : 0;
    const avgPgs = done.length ? pages / done.length : 0;
    const rate   = total ? Math.round(done.length / total * 100) : 0;

    setText('sTotal',     total === 0 ? '0' : total);
    setText('sTotalNote', total === 1 ? '1 document' : `${total} documents`);
    setText('sDone',      done.length === 0 ? '0' : done.length);
    setText('sDoneNote',  total ? `${rate}% success rate` : 'No jobs yet');
    setText('sCost',      '$' + cost.toFixed(4));
    setText('sCostNote',  `${done.length} completed job${done.length !== 1 ? 's' : ''}`);
    setText('sCredits',   Math.max(0, limit - used).toString());
    setText('sCreditsNote', `${used} of ${limit} used`);

    // Cost efficiency — show zeros not dashes when no jobs yet
    setText('avgCost',   done.length ? fmt.usd(avgCst) : '$0.0000');
    setText('totalPages', pages > 0 ? pages : '0');
    setText('avgPages',   done.length ? avgPgs.toFixed(1) : '0');

    const srEl = $('successRate');
    if (srEl) {
      srEl.textContent = total ? rate + '%' : '0%';
      srEl.style.color = rate >= 90 ? 'var(--green)' : rate >= 70 ? 'var(--amber)' : total ? 'var(--red)' : 'var(--ink3)';
    }
  }

  function setText(id, val) {
    const el = $(id); if (el) el.textContent = val;
  }

  /* ── Recent jobs table ── */
  function statusPill(status) {
    const s = (status || '').toLowerCase();
    if (s === 'complete')   return `<span class="pill pill-complete"><span class="pill-dot"></span>Complete</span>`;
    if (s === 'processing') return `<span class="pill pill-processing"><span class="pill-dot"></span>Processing</span>`;
    if (s === 'queued')     return `<span class="pill pill-queued">Queued</span>`;
    if (s === 'failed')     return `<span class="pill pill-failed">Failed</span>`;
    return `<span class="pill">${status || 'Unknown'}</span>`;
  }

  function renderRecentJobs() {
    const jobs  = loadJobs().slice(0, 8);
    const tbody = $('recentBody');
    const meta  = $('recentMeta');
    if (!tbody) return;

    if (!jobs.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="tbl-empty">
        <div class="tbl-empty-icon"><svg width="24" height="24" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="1.5"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.5"/></svg></div>
        <div class="tbl-empty-title">No jobs yet</div>
        <div class="tbl-empty-sub">Click <strong>Upload PDF</strong> above to get started</div>
      </div></td></tr>`;
      if (meta) meta.textContent = 'No jobs in history';
      return;
    }

    if (meta) meta.textContent = `${jobs.length} recent job${jobs.length !== 1 ? 's' : ''}`;

    tbody.innerHTML = jobs.map(j => {
      const s      = (j.status || '').toLowerCase();
      const isProc = s === 'processing' || s === 'queued';
      const rowCls = isProc ? ' class="tbl-row-processing"' : '';
      const actions = s === 'complete'
        ? `<div class="flex gap-6">${j.resultUrl ? `<a href="${j.resultUrl}" class="btn btn-sm btn-secondary" download>↓ PDF</a>` : ''}<button class="btn btn-sm btn-ghost" onclick="viewJob('${j.jobId}')">View</button></div>`
        : isProc ? `<span class="text-xs text-subtle">Polling…</span>` : `<span class="text-xs text-subtle">—</span>`;
      return `<tr${rowCls}>
        <td><div class="tbl-filename">${fmt.trunc(j.fileName, 36)}</div><div class="tbl-meta">${fmt.bytes(j.fileSize)} · ${fmt.pages(j.pageCount || 0)} · ${fmt.relative(j.submittedAt)}</div></td>
        <td>${statusPill(j.status)}</td>
        <td><span class="font-mono text-sm text-ink2">${j.costTotal != null ? fmt.usd(j.costTotal) : '—'}</span></td>
        <td>${actions}</td>
      </tr>`;
    }).join('');
  }

  window.viewJob = function (jobId) { location.href = `/viewer?jobId=${encodeURIComponent(jobId)}`; };

  /* ── Activity feed ── */
  function addActivity(text, type = 'info') {
    const feed = $('activityFeed');
    if (!feed) return;
    const row = document.createElement('div');
    row.className = 'activity-row';
    row.innerHTML = `<div class="activity-dot ${type}"></div><div class="activity-text">${text}</div><div class="activity-time">${fmt.time(new Date().toISOString())}</div>`;
    feed.prepend(row);
    while (feed.children.length > 12) feed.removeChild(feed.lastChild);
  }

  /* ── Modal ── */
  function openModal()  { $('uploadModal').classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeModal() { $('uploadModal').classList.remove('open'); document.body.style.overflow = ''; resetModal(); }

  function stepActive(n) {
    for (let i = 1; i <= 4; i++) {
      const el = $(`st${i}`); if (!el) continue;
      el.classList.remove('active', 'done');
      if (i < n) el.classList.add('done');
      if (i === n) el.classList.add('active');
    }
  }

  let selectedFile = null, estimatedCost = null;

  function resetModal() {
    selectedFile = null; estimatedCost = null;
    $('fileInput').value = '';
    $('filePreview').classList.add('hidden');
    $('dropzone').classList.remove('hidden');
    $('costPreviewWrap').classList.add('hidden');
    $('uploadProgressWrap').classList.add('hidden');
    $('submitBtn').disabled = true;
    $('submitBtn').innerHTML = `<svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Submit for redaction`;
    stepActive(1);
    updateQuotaHint();
  }

  function updateQuotaHint() {
    const s    = Session.get() || {};
    const used = s.creditsUsed  ?? 0;
    const lim  = s.creditsLimit ?? APP_CONFIG.TRIAL.MAX_FILES;
    const rem  = Math.max(0, lim - used);
    const hint = $('quotaHint');
    if (!hint) return;
    if (rem <= 0) {
      hint.innerHTML = `<span style="color:var(--red)">⚠ No credits remaining — <a href="/pricing" style="color:var(--red)">upgrade</a></span>`;
      $('submitBtn').disabled = true;
    } else {
      hint.textContent = `${rem} credit${rem !== 1 ? 's' : ''} remaining`;
    }
  }

  async function handleFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf') { showToast('Only PDF files are accepted.', 'warn'); return; }
    if (file.size > APP_CONFIG.UPLOAD.MAX_BYTES) { showToast(`Max size is ${APP_CONFIG.TRIAL.MAX_SIZE_MB} MB.`, 'warn'); return; }
    const s   = Session.get() || {};
    const rem = Math.max(0, (s.creditsLimit ?? APP_CONFIG.TRIAL.MAX_FILES) - (s.creditsUsed ?? 0));
    if (rem <= 0) { showToast('No credits remaining. Please upgrade.', 'error'); return; }
    selectedFile = file;
    $('filePreviewName').textContent = fmt.trunc(file.name, 50);
    $('filePreviewMeta').textContent = `${fmt.bytes(file.size)} · PDF`;
    $('filePreview').classList.remove('hidden');
    $('dropzone').classList.add('hidden');
    $('submitBtn').disabled = false;
    updateQuotaHint();
    const estPages = Math.max(1, Math.round(file.size / 60_000));
    estimatedCost  = calcJobCost(estPages, fmt.mb(file.size));
    $('costDocIntel').textContent = fmt.usd(estimatedCost.docIntel);
    $('costInfra').textContent    = fmt.usd(estimatedCost.blob + estimatedCost.paFlow + estimatedCost.functions);
    $('costTotal').textContent    = estimatedCost.totalFmt;
    $('costPreviewWrap').classList.remove('hidden');
  }

  async function submitJob() {
    if (!selectedFile) return;
    const s   = Session.get() || {};
    const rem = Math.max(0, (s.creditsLimit ?? APP_CONFIG.TRIAL.MAX_FILES) - (s.creditsUsed ?? 0));
    if (rem <= 0) { showToast('No credits remaining.', 'error'); return; }
    const btn = $('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:15px;height:15px;border-width:2px;margin:0"></div> Submitting…';
    stepActive(2);
    $('uploadProgressWrap').classList.remove('hidden');
    setUploadProgress(0, 'Hashing file…');
    try {
      const checksum = await sha256(selectedFile);
      setUploadProgress(15, 'Encoding file…');
      const base64 = await fileToBase64(selectedFile);
      setUploadProgress(60, 'Sending to server…');
      const jobId = genUUID();
      const jobPayload = {
        jobId, email: s.email, token: s.token,
        fileName: selectedFile.name, fileSize: selectedFile.size,
        fileSizeMB: +fmt.mb(selectedFile.size), fileBase64: base64,
        checksum, estCost: estimatedCost?.total, submittedAt: new Date().toISOString(),
      };
      if (APP_CONFIG.FLOWS.BLOB_SAS) {
        setUploadProgress(65, 'Getting upload URL…');
        const sasRes = await paFetch(APP_CONFIG.FLOWS.BLOB_SAS, { email: s.email, fileName: selectedFile.name });
        if (sasRes?.sasUrl) {
          setUploadProgress(70, 'Uploading to Azure…');
          await fetch(sasRes.sasUrl, { method: 'PUT', headers: { 'x-ms-blob-type': 'BlockBlob', 'Content-Type': 'application/pdf' }, body: selectedFile });
          jobPayload.blobUrl    = sasRes.blobUrl || sasRes.sasUrl.split('?')[0];
          jobPayload.fileBase64 = undefined;
          setUploadProgress(85, 'Submitting job…');
        }
      } else { setUploadProgress(75, 'Submitting job…'); }
      const res = await paFetch(APP_CONFIG.FLOWS.JOB_SUBMIT, jobPayload);
      setUploadProgress(100, 'Job submitted!');
      stepActive(3);
      const job = {
        jobId, fileName: selectedFile.name, fileSize: selectedFile.size,
        pageCount: 0, status: 'Queued', submittedAt: new Date().toISOString(),
        completedAt: null, blobUrl: jobPayload.blobUrl || null,
        resultUrl: res?.resultUrl || null, costTotal: estimatedCost?.total || null, errorMessage: null,
      };
      saveJob(job);
      Session.patch({ creditsUsed: (s.creditsUsed ?? 0) + 1 });
      addActivity(`Job submitted: ${fmt.trunc(selectedFile.name, 30)}`, 'info');
      showToast('Job submitted successfully!', 'success');
      pollJobStatus(jobId, s.email);
      renderStats(); renderRecentJobs(); Shell.refreshQuota();
      setTimeout(closeModal, 1400);
    } catch (err) {
      stepActive(1);
      setUploadProgress(0, '');
      $('uploadProgressWrap').classList.add('hidden');
      btn.disabled = false;
      btn.innerHTML = `<svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Submit for redaction`;
      showToast(err.message || 'Submission failed. Please try again.', 'error');
      addActivity(`Error: ${err.message || 'Submission failed'}`, 'error');
    }
  }

  function setUploadProgress(pct, label) {
    const fill = $('uploadProgressFill'), bar = $('uploadProgressBar');
    const sub  = $('uploadProgressSub'),  pctEl = $('uploadPct');
    if (fill) fill.style.width = pct + '%';
    if (bar)  bar.setAttribute('aria-valuenow', pct);
    if (sub)  sub.textContent = label;
    if (pctEl)pctEl.textContent = pct + '%';
  }

  const activePolls = new Map();

  function pollJobStatus(jobId, email) {
    if (!APP_CONFIG.FLOWS.JOB_STATUS || activePolls.has(jobId)) return;
    let attempts = 0;
    const timer = setInterval(async () => {
      attempts++;
      if (attempts > 120) {
        clearInterval(timer); activePolls.delete(jobId);
        updateJob(jobId, { status: 'Failed', errorMessage: 'Timed out.' });
        renderRecentJobs(); renderStats(); return;
      }
      try {
        const res = await paFetch(APP_CONFIG.FLOWS.JOB_STATUS, { jobId, email });
        if (!res) return;
        const status = res.status || res.Status || '';
        updateJob(jobId, { status, resultUrl: res.resultUrl, pageCount: res.pageCount, costTotal: res.costTotal });
        renderRecentJobs(); renderStats();
        if (['complete','failed','error'].includes(status.toLowerCase())) {
          clearInterval(timer); activePolls.delete(jobId);
          const j = loadJobs().find(x => x.jobId === jobId);
          if (status.toLowerCase() === 'complete') {
            addActivity(`Completed: ${fmt.trunc(j?.fileName || jobId, 30)}`, 'success');
            showToast('Redaction complete! Download is ready.', 'success', 6000);
            stepActive(4);
          } else {
            addActivity(`Failed: ${fmt.trunc(j?.fileName || jobId, 30)}`, 'error');
            showToast('Job failed. Check the history page for details.', 'error');
          }
        }
      } catch {}
    }, APP_CONFIG.APP.POLL_INTERVAL_MS);
    activePolls.set(jobId, timer);
  }

  function resumePolling() {
    const s = Session.get() || {};
    loadJobs().forEach(j => {
      const st = (j.status || '').toLowerCase();
      if (st === 'processing' || st === 'queued') pollJobStatus(j.jobId, s.email);
    });
  }

  /* ── Wire events ── */
  $('openUploadBtn')?.addEventListener('click', openModal);
  $('closeModal')?.addEventListener('click', closeModal);
  $('cancelUploadBtn')?.addEventListener('click', closeModal);
  $('uploadModal')?.addEventListener('click', e => { if (e.target === $('uploadModal')) closeModal(); });
  $('submitBtn')?.addEventListener('click', submitJob);
  $('fileRemoveBtn')?.addEventListener('click', () => {
    selectedFile = null; $('fileInput').value = '';
    $('filePreview').classList.add('hidden'); $('dropzone').classList.remove('hidden');
    $('costPreviewWrap').classList.add('hidden'); $('submitBtn').disabled = true;
  });
  $('fileInput')?.addEventListener('change', e => { if (e.target.files?.[0]) handleFile(e.target.files[0]); });

  const dz = $('dropzone');
  if (dz) {
    dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', ()  => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); const f = e.dataTransfer?.files?.[0]; if (f) handleFile(f); });
    dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') $('fileInput')?.click(); });
  }

  $('refreshBtn')?.addEventListener('click', () => { renderStats(); renderRecentJobs(); Shell.refreshQuota(); showToast('Refreshed', 'info', 1800); });
  $('exportRecentBtn')?.addEventListener('click', () => {
    const jobs = loadJobs().slice(0, 8).map(j => ({
      JobId: j.jobId, FileName: j.fileName, SizeMB: fmt.mb(j.fileSize),
      Pages: j.pageCount || 0, Status: j.status,
      Submitted: fmt.datetime(j.submittedAt), Completed: j.completedAt ? fmt.datetime(j.completedAt) : '',
      Cost_USD: j.costTotal ?? '',
    }));
    exportCSV(jobs, 'prudent-recent-jobs.csv');
  });

  /* ── Initial render ── */
  renderStats();
  renderRecentJobs();
  resumePolling();
  updateQuotaHint();

})();
