<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Loading</title>
<link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div class="shell" id="appShell" style="display:none"></div>
<div id="bootScreen" style="min-height:100vh;display:grid;place-items:center;background:var(--page-bg)">
  <div class="spinner" style="margin:auto"></div>
</div>
<script src="/js/config.js"></script>
<script src="/js/shell.js"></script>
<script>
// Auth check runs before ANY content is shown
if (!Session.valid()) { location.replace('/login'); }
else {
  document.getElementById('bootScreen').style.display = 'none';
  document.getElementById('appShell').style.display = '';
}
</script>
<script>
(function () {
  'use strict';

  Shell.init('dashboard');
  const session = Session.get();
  const $       = id => document.getElementById(id);
  const email   = session?.email || '';

  /* ── Greeting — always prefer fullName from session ── */
  const greetEl = $('welcomeTitle');
  if (greetEl) {
    const s    = Session.get() || {};
    const name = s.fullName
      || (email ? email.split('@')[0].replace(/[._-]+/g,' ').replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase()) : 'there');
    greetEl.textContent = `${greeting()}, ${name} 👋`;
  }

  /* ── Dynamic dropzone constraints from session plan ── */
  function updateDropzoneConstraints() {
    const s     = Session.get() || {};
    const maxMB = s.maxFileSizeMB   || APP_CONFIG.PLANS?.[s.plan||'trial']?.maxFileSizeMB   || 10;
    const maxPg = s.maxPagesPerFile || APP_CONFIG.PLANS?.[s.plan||'trial']?.maxPagesPerFile  || 50;
    const sizeEl = $('dropzoneMaxSize');
    const pageEl = $('dropzoneMaxPages');
    if (sizeEl) sizeEl.textContent = maxMB;
    if (pageEl) pageEl.textContent = maxPg;
  }
  updateDropzoneConstraints();

  /* ══════════════════════════════════════════════════════
     JOBS — driven entirely from Supabase via jobs-list API
     ══════════════════════════════════════════════════════ */
  let allJobs = []; // in-memory cache from Supabase
  let jobsLoaded = false;

  async function fetchJobsFromSupabase() {
    try {
      const res = await paFetch(APP_CONFIG.FLOWS.JOB_LIST, { email, days: 30 });
      if (Array.isArray(res)) {
        allJobs = res;
        jobsLoaded = true;
        renderRecentJobs();
        renderStats();
        // Start polling for any in-progress jobs
        allJobs.forEach(j => {
          const st = (j.status || '').toLowerCase();
          if (st === 'queued' || st === 'processing') {
            startPolling(j.jobId);
          }
        });
      }
    } catch (err) {
      /* error handled silently */
    }
  }

  function getJob(jobId) { return allJobs.find(j => j.jobId === jobId); }

  function upsertJob(job) {
    const idx = allJobs.findIndex(j => j.jobId === job.jobId);
    if (idx >= 0) allJobs[idx] = { ...allJobs[idx], ...job };
    else allJobs.unshift(job);
  }

  /* ── Stats ── */
  function renderStats() {
    const s     = Session.get() || {};
    const used  = s.creditsUsed  ?? 0;
    const limit = s.creditsLimit ?? APP_CONFIG.PLANS?.trial?.filesPerMonth ?? 5;
    const done  = allJobs.filter(j => (j.status || '').toLowerCase() === 'complete');
    const total = allJobs.length;
    const cost  = done.reduce((sum, j) => sum + (+(j.costTotal || 0)), 0);
    const pages = done.reduce((sum, j) => sum + (+(j.pageCount || 0)), 0);
    const avgCst = done.length ? cost / done.length : 0;
    const avgPgs = done.length ? pages / done.length : 0;
    const rate   = total ? Math.round(done.length / total * 100) : 0;

    // Clear skeletons and set real values
    setText('sTotal',       String(total));
    setText('sTotalNote',   total === 1 ? '1 document' : `${total} documents`);
    setText('sDone',        String(done.length));
    setText('sDoneNote',    total ? `${rate}% success rate` : 'No jobs yet');
    setText('sCost',        '$' + cost.toFixed(2));
    setText('sCostNote',    `${done.length} completed job${done.length !== 1 ? 's' : ''}`);
    setText('sCredits',     String(Math.max(0, limit - used)));
    setText('sCreditsNote', `${used} of ${limit} used · ${s.planLabel || s.plan || 'Trial'}`);
    setText('avgCost',      done.length ? '$' + avgCst.toFixed(2) : '$0.00');
    setText('totalPages',   String(pages));
    setText('avgPages',     done.length ? avgPgs.toFixed(1) : '0');
    setText('sCostInsight', '$' + cost.toFixed(2));
    const srEl = $('successRate');
    if (srEl) {
      srEl.textContent = total ? rate + '%' : '0%';
      srEl.style.color = total === 0 ? 'var(--ink3)' : rate >= 90 ? 'var(--green)' : rate >= 70 ? 'var(--amber)' : 'var(--red)';
    }
    // Update dropzone constraints in case plan changed
    updateDropzoneConstraints();

    // BUG-08: Show onboarding banner only when jobs are done loading and count is 0
    const banner = document.getElementById('onboardingBanner');
    if (banner) banner.classList.toggle('hidden', !jobsLoaded || total > 0);
  }

  function setText(id, val) { const el=$(id); if(el) el.textContent=val; }

  /* ── Recent jobs table ── */
  function statusPill(status) {
    const s = (status || '').toLowerCase();
    if (s === 'complete')   return `<span class="pill pill-complete"><span class="pill-dot"></span>Complete</span>`;
    if (s === 'processing') return `<span class="pill pill-processing"><span class="pill-dot"></span>Processing</span>`;
    if (s === 'queued')     return `<span class="pill pill-processing"><span class="pill-dot"></span>Queued</span>`;
    if (s === 'failed')     return `<span class="pill pill-failed">Failed</span>`;
    return `<span class="pill pill-processing"><span class="pill-dot"></span>Queued</span>`;
  }

  function renderRecentJobs() {
    const jobs  = allJobs.slice(0, 8);
    const tbody = $('recentBody');
    const meta  = $('recentMeta');
    if (!tbody) return;

    if (!jobsLoaded) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="tbl-empty"><div class="tbl-empty-title">Loading jobs…</div></div></td></tr>`;
      return;
    }

    if (!jobs.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="tbl-empty" style="padding:40px 24px">
        <svg width="120" height="100" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:16px;opacity:.7">
          <rect x="20" y="10" width="52" height="66" rx="6" fill="var(--surface2)" stroke="var(--border2)" stroke-width="1.5"/>
          <rect x="28" y="24" width="28" height="3" rx="1.5" fill="var(--border2)"/>
          <rect x="28" y="32" width="36" height="3" rx="1.5" fill="var(--border2)"/>
          <rect x="28" y="40" width="22" height="3" rx="1.5" fill="var(--border2)"/>
          <rect x="28" y="48" width="30" height="3" rx="1.5" fill="var(--border2)"/>
          <path d="M34 14h24l10 10v8H34V14z" fill="var(--blue-bg)" stroke="var(--blue-bd)" stroke-width="1.2"/>
          <path d="M58 14v10h10" stroke="var(--blue-bd)" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="85" cy="68" r="22" fill="var(--blue-bg)" stroke="var(--blue-bd)" stroke-width="1.5"/>
          <path d="M85 60v8M85 72h.01" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M78 55l7-7 7 7M85 48v16" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="tbl-empty-title" style="font-size:15px;font-weight:700;margin-bottom:6px">No jobs yet</div>
        <div class="tbl-empty-sub" style="margin-bottom:16px">Upload your first PDF to get started with AI-powered redaction</div>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('openUploadBtn')?.click()">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Upload your first PDF
        </button>
      </div></td></tr>`;

      if (meta) meta.textContent = 'No jobs in history';
      return;
    }

    if (meta) meta.textContent = `${jobs.length} recent job${jobs.length !== 1 ? 's' : ''}`;
    tbody.innerHTML = jobs.map(j => {
      const s = (j.status || '').toLowerCase();
      const isProc = s === 'processing' || s === 'queued';
      const rowCls = isProc ? ' class="tbl-row-processing"' : '';
      const actions = s === 'complete'
        ? `<div class="flex gap-6">${j.resultUrl ? `<a href="#" class="btn btn-sm btn-secondary" onclick="downloadJob('${j.jobId}');return false">↓ PDF</a>` : ''}<button class="btn btn-sm btn-ghost" onclick="viewJob('${j.jobId}')">View</button></div>`
        : isProc
          ? `<span class="text-xs text-subtle" style="display:flex;align-items:center;gap:5px"><div class="spinner" style="width:11px;height:11px;border-width:1.5px;margin:0"></div>Processing…</span>`
          : `<span class="text-xs text-subtle">—</span>`;
      return `<tr${rowCls}>
        <td><div class="tbl-filename">${fmt.trunc(j.fileName, 36)}</div><div class="tbl-meta">${fmt.bytes(j.fileSize)} · ${fmt.pages(j.pageCount || 0)} · ${fmt.relative(j.submittedAt)}</div></td>
        <td>${statusPill(j.status)}</td>
        <td><span class="font-mono text-sm text-ink2">${j.costTotal != null ? fmt.usd(j.costTotal) : '—'}</span></td>
        <td>${actions}</td>
      </tr>`;
    }).join('');
  }

  window.viewJob = jobId => { location.href = `/viewer?jobId=${encodeURIComponent(jobId)}`; };

  window.downloadJob = async jobId => {
    const j = getJob(jobId);
    if (!j?.resultUrl) { showToast('Result not available', 'warn'); return; }
    try {
      // Extract blob name from resultUrl
      const parts    = j.resultUrl.split('/');
      const blobName = parts[parts.length - 1];
      const container = parts[parts.length - 2];
      const sasRes = await paFetch(APP_CONFIG.FLOWS.BLOB_SAS, { email, blobName, container, mode: 'read' });
      if (sasRes?.sasUrl) window.open(sasRes.sasUrl, '_blank');
      else showToast('Could not generate download link', 'error');
    } catch { showToast('Download failed', 'error'); }
  };

  /* ── Activity feed — BUG-12: "Ready" badge switches to "Live" on first real activity ── */
  function addActivity(text, type = 'info') {
    const feed  = $('activityFeed');
    const badge = $('activityBadge');
    if (!feed) return;
    // Switch badge from "Ready" to "Live" on first real event
    if (badge && badge.textContent.trim() === 'Ready') {
      badge.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;vertical-align:middle"></span>Live';
      badge.style.cssText = 'font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green)';
    }
    const row = document.createElement('div');
    row.className = 'activity-row';
    row.innerHTML = `<div class="activity-dot ${type}"></div><div class="activity-text">${text}</div><div class="activity-time">${fmt.time(new Date().toISOString())}</div>`;
    feed.prepend(row);
    while (feed.children.length > 12) feed.removeChild(feed.lastChild);
  }

  /* ══════════════════════════════════════════════════════
     POLLING — polls Supabase for job status updates
     Runs every 5 seconds for any queued/processing job
     ══════════════════════════════════════════════════════ */
  const activePolls = new Map();

  function startPolling(jobId) {
    if (activePolls.has(jobId)) return;
    let attempts = 0;
    const timer = setInterval(async () => {
      attempts++;
      if (attempts > 144) { // 12 min max
        clearInterval(timer); activePolls.delete(jobId);
        upsertJob({ jobId, status: 'failed', errorMessage: 'Timed out.' });
        renderRecentJobs(); renderStats(); return;
      }
      try {
        const res = await paFetch(APP_CONFIG.FLOWS.JOB_STATUS, { jobId, email });
        if (!res) return;
        const status    = res.status || '';
        const resultUrl = res.result_url || res.resultUrl || null;
        const pageCount = res.page_count || res.pageCount || 0;
        const costTotal = res.cost_total || res.costTotal || null;
        upsertJob({ jobId, status, resultUrl, pageCount, costTotal });
        renderRecentJobs(); renderStats();
        if (['complete','failed','error'].includes(status.toLowerCase())) {
          clearInterval(timer); activePolls.delete(jobId);
          const j = getJob(jobId);
          if (status.toLowerCase() === 'complete') {
            addActivity(`✓ Completed: ${fmt.trunc(j?.fileName || jobId, 30)}`, 'success');
            showToast('Redaction complete! Your file is ready to download.', 'success', 8000);
            // Browser notification if tab not focused
            if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
              new Notification('Prudent PDF — Redaction Complete', {
                body : `${j?.fileName || 'Your file'} is ready to download.`,
                icon : '/favicon.svg',
              });
            }
          } else {
            addActivity(`✕ Failed: ${fmt.trunc(j?.fileName || jobId, 30)}`, 'error');
            showToast('Job failed. Check history for details.', 'error');
          }
        }
      } catch {}
    }, APP_CONFIG.APP.POLL_INTERVAL_MS);
    activePolls.set(jobId, timer);
  }

  /* ══════════════════════════════════════════════════════
     AUTO-REFRESH — re-fetches all jobs from Supabase
     every 30 seconds to catch PA callbacks
     ══════════════════════════════════════════════════════ */
  setInterval(fetchJobsFromSupabase, 30_000);

  /* ── Modal ── */
  function openModal()  { $('uploadModal').classList.add('open'); document.body.style.overflow='hidden'; }
  function closeModal() { $('uploadModal').classList.remove('open'); document.body.style.overflow=''; resetModal(); }

  function stepActive(n) {
    for (let i=1;i<=4;i++) { const el=$(`st${i}`); if(!el) continue; el.classList.remove('active','done'); if(i<n)el.classList.add('done'); if(i===n)el.classList.add('active'); }
  }

  let selectedFile=null, estimatedCost=null;

  function resetModal() {
    selectedFile=null; estimatedCost=null;
    $('fileInput').value='';
    $('filePreview').classList.add('hidden');
    $('dropzone').classList.remove('hidden');
    $('costPreviewWrap').classList.add('hidden');
    $('uploadProgressWrap').classList.add('hidden');
    $('submitBtn').disabled=true;
    $('submitBtn').innerHTML=`<svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Submit for redaction`;
    stepActive(1);
    updateQuotaHint();
  }

  function updateQuotaHint() {
    const s       = Session.get() || {};
    const used    = s.creditsUsed  ?? 0;
    const limit   = s.creditsLimit ?? APP_CONFIG.PLANS.trial.filesPerMonth;
    const rem     = Math.max(0, limit - used);
    const maxMB   = s.maxFileSizeMB   || APP_CONFIG.PLANS.trial.maxFileSizeMB;
    const maxPg   = s.maxPagesPerFile || APP_CONFIG.PLANS.trial.maxPagesPerFile;
    const plan    = s.planLabel       || s.plan || 'trial';
    const hint    = $('quotaHint');
    if (!hint) return;
    if (rem <= 0) {
      hint.innerHTML = `<span style="color:var(--red)">⚠ No files remaining — <a href="/pricing" style="color:var(--red)">upgrade</a></span>`;
      $('submitBtn').disabled = true;
    } else {
      hint.innerHTML = `<span>${rem} file${rem!==1?'s':''} left</span> <span style="color:var(--ink3);margin:0 4px">·</span> <span style="color:var(--ink3)">Max ${maxMB} MB · ${maxPg} pages</span>`;
    }
  }

  async function handleFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf') { showToast('Only PDF files are accepted.', 'warn'); return; }

    const s      = Session.get() || {};
    const maxMB  = s.maxFileSizeMB   || APP_CONFIG.PLANS[s.plan || 'trial']?.maxFileSizeMB   || 10;
    const maxPg  = s.maxPagesPerFile || APP_CONFIG.PLANS[s.plan || 'trial']?.maxPagesPerFile  || 50;
    const maxBytes = maxMB * 1024 * 1024;

    if (file.size > maxBytes) {
      showToast(`File too large. Your ${s.planLabel || 'plan'} allows up to ${maxMB} MB per file.`, 'error');
      return;
    }

    const rem = Math.max(0, (s.creditsLimit ?? APP_CONFIG.PLANS.trial.filesPerMonth) - (s.creditsUsed ?? 0));
    if (rem <= 0) { showToast('No files remaining. Please upgrade your plan.', 'error'); return; }

    selectedFile = file;
    $('filePreviewName').textContent = fmt.trunc(file.name, 50);
    $('filePreviewMeta').textContent = `${fmt.bytes(file.size)} · PDF`;
    $('filePreview').classList.remove('hidden');
    $('dropzone').classList.add('hidden');
    $('submitBtn').disabled = false;
    updateQuotaHint();

    // Estimate pages from file size (~60KB per page)
    const estPages = Math.max(1, Math.round(file.size / 60_000));

    // Warn if estimated pages may exceed plan limit
    if (estPages > maxPg) {
      showToast(`Warning: this file may exceed your ${maxPg}-page limit. Large files may be rejected after processing.`, 'warn', 6000);
    }

    estimatedCost = calcJobCost(estPages, fmt.mb(file.size));
    $('costDocIntel').textContent = fmt.usd(estimatedCost.docIntel);
    $('costInfra').textContent    = fmt.usd((estimatedCost.blob || 0) + (estimatedCost.paFlow || 0));
    $('costTotal').textContent    = estimatedCost.totalFmt;
    $('costPreviewWrap').classList.remove('hidden');
  }

  /* ── Submit job ── */
  async function submitJob() {
    if(!selectedFile) return;
    const s   = Session.get() || {};
    const rem = Math.max(0, (s.creditsLimit ?? APP_CONFIG.PLANS.trial.filesPerMonth) - (s.creditsUsed ?? 0));
    if (rem <= 0) { showToast('No files remaining. Please upgrade your plan.', 'error'); return; }

    const btn=$('submitBtn');
    btn.disabled=true;
    btn.innerHTML='<div class="spinner" style="width:15px;height:15px;border-width:2px;margin:0"></div> Submitting…';
    stepActive(2);
    $('uploadProgressWrap').classList.remove('hidden');
    setUploadProgress(0,'Hashing file…');

    try {
      const checksum = await sha256(selectedFile);
      setUploadProgress(15, 'Encoding file…');
      const base64 = await fileToBase64(selectedFile);
      setUploadProgress(40, 'Getting upload URL…');

      const jobId = genUUID();
      let blobUrl  = null;
      let blobName = '';

      // Get SAS URL from blob-sas — it defines the blob name
      if (APP_CONFIG.FLOWS.BLOB_SAS) {
        setUploadProgress(45, 'Getting secure upload URL…');
        const sasRes = await paFetch(APP_CONFIG.FLOWS.BLOB_SAS, {
          email, fileName: selectedFile.name, jobId,
        });
        if (sasRes?.sasUrl) {
          setUploadProgress(55, 'Uploading PDF to Azure Blob…');
          const uploadRes = await fetch(sasRes.sasUrl, {
            method  : 'PUT',
            headers : { 'x-ms-blob-type': 'BlockBlob', 'Content-Type': 'application/pdf' },
            body    : selectedFile,
          });
          if (!uploadRes.ok) throw new Error(`Blob upload failed (${uploadRes.status})`);
          blobUrl  = sasRes.blobUrl;
          blobName = sasRes.blobName;
          setUploadProgress(75, 'File uploaded. Triggering PA flow…');
        }
      }

      // Submit job — includes base64 for PA to process directly
      const res = await paFetch(APP_CONFIG.FLOWS.JOB_SUBMIT, {
        jobId,
        email,
        fileName   : selectedFile.name,
        blobName,
        blobUrl,
        fileBase64 : base64,
        fileSize   : selectedFile.size,
        fileSizeMB : +fmt.mb(selectedFile.size),
        checksum,
        estCost    : estimatedCost?.total,
        submittedAt: new Date().toISOString(),
      });

      setUploadProgress(100,'Job submitted! PA flow triggered ✓');
      stepActive(3);

      // Add job to in-memory list immediately
      const newJob = {
        jobId        : res?.jobId    || jobId,
        fileName     : selectedFile.name,
        fileSize     : selectedFile.size,
        blobName,
        blobUrl,
        pageCount    : 0,
        status       : 'queued',
        submittedAt  : new Date().toISOString(),
        completedAt  : null,
        resultUrl    : res?.outputBlobUrl || null,
        costTotal    : estimatedCost?.total || null,
        errorMessage : null,
      };
      upsertJob(newJob);
      Session.patch({ creditsUsed: (s.creditsUsed ?? 0) + 1 });
      addActivity(`Job submitted: ${fmt.trunc(selectedFile.name, 30)}`, 'info');
      showToast('Job submitted! Power Automate is processing your PDF.', 'success');

      // Start polling for this job
      startPolling(newJob.jobId);
      // Request browser notification permission for job complete alerts
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      renderRecentJobs();
      renderStats();
      Shell.refreshQuota();

      // Close modal after short delay
      setTimeout(closeModal, 1500);

    } catch (err) {
      stepActive(1);
      setUploadProgress(0,'');
      $('uploadProgressWrap').classList.add('hidden');
      btn.disabled=false;
      btn.innerHTML=`<svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Submit for redaction`;
      // Sanitise — never expose internal DB/stack errors to user
      const raw = err.message || '';
      const userMsg = raw.includes('uuid') || raw.includes('syntax') || raw.includes('relation') || raw.includes('column')
        ? 'Something went wrong on our end. Please try again.'
        : raw.includes('quota') || raw.includes('limit') || raw.includes('Quota')
          ? raw
          : raw.includes('large') || raw.includes('413')
            ? raw
            : raw || 'Submission failed. Please try again.';
      showToast(userMsg, 'error');
      addActivity(`Error: ${fmt.trunc(userMsg, 40)}`, 'error');
    }
  }

  function setUploadProgress(pct,label) {
    const fill=$('uploadProgressFill'),bar=$('uploadProgressBar'),sub=$('uploadProgressSub'),pctEl=$('uploadPct');
    if(fill)fill.style.width=pct+'%'; if(bar)bar.setAttribute('aria-valuenow',pct);
    if(sub)sub.textContent=label; if(pctEl)pctEl.textContent=pct+'%';
  }

  /* ── Wire events ── */
  $('openUploadBtn')?.addEventListener('click',openModal);
  $('closeModal')?.addEventListener('click',closeModal);
  $('cancelUploadBtn')?.addEventListener('click',closeModal);
  $('uploadModal')?.addEventListener('click',e=>{if(e.target===$('uploadModal'))closeModal();});
  $('submitBtn')?.addEventListener('click',submitJob);
  $('fileRemoveBtn')?.addEventListener('click',()=>{selectedFile=null;$('fileInput').value='';$('filePreview').classList.add('hidden');$('dropzone').classList.remove('hidden');$('costPreviewWrap').classList.add('hidden');$('submitBtn').disabled=true;});
  $('fileInput')?.addEventListener('change',e=>{if(e.target.files?.[0])handleFile(e.target.files[0]);});
  const dz=$('dropzone');
  if(dz){
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');const f=e.dataTransfer?.files?.[0];if(f)handleFile(f);});
    dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')$('fileInput')?.click();});
  }
  $('refreshBtn')?.addEventListener('click',()=>{fetchJobsFromSupabase();showToast('Refreshed','info',1800);});
  $('exportRecentBtn')?.addEventListener('click',()=>{
    const jobs=allJobs.slice(0,8).map(j=>({JobId:j.jobId,FileName:j.fileName,SizeMB:fmt.mb(j.fileSize),Pages:j.pageCount||0,Status:j.status,Submitted:fmt.datetime(j.submittedAt),Completed:j.completedAt?fmt.datetime(j.completedAt):'',Cost_USD:j.costTotal??''}));
    exportCSV(jobs,'prudent-recent-jobs.csv');
  });

  /* ── Initial load ── */
  fetchJobsFromSupabase();  // load from Supabase immediately
  updateQuotaHint();

  // Auto-open upload modal if navigated via #upload hash (sidebar "New Redaction")
  if (location.hash === '#upload') {
    history.replaceState(null, '', location.pathname);
    setTimeout(openModal, 300);
  }

})();
</script>
</body>
</html>
