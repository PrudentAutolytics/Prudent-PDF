<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>History</title>
<link rel="stylesheet" href="/css/main.css"/>
<link rel="stylesheet" href="/css/enterprise-responsive.css"/>
<style>
.filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.filter-input { background:var(--surface); border:1.5px solid var(--border2); border-radius:var(--r8); padding:7px 12px 7px 32px; font-size:13px; color:var(--ink); transition:all var(--dur2) var(--ease); flex:1; min-width:180px; font-family:var(--font); }
.filter-input:focus { border-color:var(--blue); box-shadow:var(--s-glow); outline:none; }
.filter-input-wrap { position:relative; flex:1; min-width:180px; }
.filter-input-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink3); pointer-events:none; }
.bulk-actions-bar { display:none; align-items:center; gap:10px; padding:10px 22px; background:var(--blue-bg); border-bottom:1px solid var(--blue-bd); }
.bulk-actions-bar.visible { display:flex; animation:slide-down .18s ease; }
@keyframes slide-down { from{opacity:0;transform:translateY(-5px)} }
.detail-row td { background:var(--surface2); padding:0!important; }
.detail-inner { padding:18px 24px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
@media(max-width:700px){.detail-inner{grid-template-columns:1fr}}
.detail-field { display:flex; flex-direction:column; gap:3px; }
.detail-key { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); }
.detail-val { font-size:13px; color:var(--ink2); font-weight:500; word-break:break-word; }
.detail-val.mono { font-family:var(--mono); font-size:12px; }
.fields-table { width:100%; border-collapse:collapse; grid-column:1/-1; }
.fields-table th { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); padding:6px 10px; background:var(--surface3); border:1px solid var(--border); font-weight:700; text-align:left; }
.fields-table td { font-size:12.5px; color:var(--ink2); padding:7px 10px; border:1px solid var(--border); }
.fields-table tr:hover td { background:var(--surface2); }
.loading-row td { text-align:center; padding:40px!important; color:var(--ink3); }
</style>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#173967"/>
</head>
<body>

<div class="shell" id="appShell">
  <main class="main">

    <!-- Page header -->
    <div class="page-hd anim">
      <div>
        <div class="page-hd-eyebrow">
          <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Workspace
        </div>
        <div class="page-title">Job History</div>
        <div class="page-subtitle">All redaction jobs - search, filter, and export with full cost breakdowns.</div>
      </div>
      <div class="page-hd-actions">
        <button class="btn btn-secondary" id="refreshBtn">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Refresh
        </button>
        <button class="btn btn-secondary" id="exportAllBtn">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Export All CSV
        </button>
        <a href="/dashboard" class="btn btn-primary">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          New Redaction
        </a>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card blue anim d1">
        <div class="stat-label">Total Files</div>
        <div class="stat-val" id="stTotal"><span class="skeleton skeleton-val"></span></div>
        <div class="stat-note" id="stTotalNote"><span class="skeleton skeleton-note"></span></div>
        <div class="stat-bg-icon"><svg width="44" height="44" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="1.4"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.4"/></svg></div>
      </div>
      <div class="stat-card green anim d2">
        <div class="stat-label">Success Rate</div>
        <div class="stat-val" id="stSuccess"><span class="skeleton skeleton-val"></span></div>
        <div class="stat-note" id="stSuccessNote"><span class="skeleton skeleton-note"></span></div>
        <div class="stat-bg-icon"><svg width="44" height="44" fill="none" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="stat-card amber anim d3">
        <div class="stat-label">Total Cost (30d)</div>
        <div class="stat-val" id="stCost">$0.00</div>
        <div class="stat-note" id="stCostNote"><span class="skeleton skeleton-note"></span></div>
        <div class="stat-bg-icon"><svg width="44" height="44" fill="none" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23" stroke="currentColor" stroke-width="1.4"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      </div>
      <div class="stat-card violet anim d4">
        <div class="stat-label">Avg Cost / File</div>
        <div class="stat-val" id="stAvg" style="color:var(--violet)"><span class="skeleton skeleton-val"></span></div>
        <div class="stat-note">Per processed document</div>
        <div class="stat-bg-icon" style="color:var(--violet)"><svg width="44" height="44" fill="none" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>

    <!-- Bulk action bar -->
    <div class="bulk-actions-bar" id="bulkBar" role="toolbar">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" style="color:var(--blue)"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="font-display font-bold text-blue" id="bulkCount">0 selected</span>
      <button class="btn btn-sm btn-secondary" id="bulkExportBtn">Export selected CSV</button>
      <button class="btn btn-sm btn-danger" id="bulkClearBtn">✕ Clear</button>
    </div>

    <!-- Jobs table -->
    <div class="card anim d2">
      <div class="card-hd" style="flex-direction:column;align-items:stretch;gap:14px">
        <div class="flex-between gap-10">
          <div class="card-title">
            <div class="card-title-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            All Jobs
            <span class="nav-link-badge blue" id="jobCountBadge">0</span>
          </div>
          <div class="flex gap-8">
            <button class="btn btn-ghost btn-sm" id="selectAllBtn">Select all visible</button>
            <button class="btn btn-ghost btn-sm" id="deselectBtn">Deselect all</button>
          </div>
        </div>
        <div class="filter-bar">
          <div class="filter-input-wrap">
            <span class="filter-input-icon"><svg width="13" height="13" fill="none" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="1.7"/><path d="M21 21l-4.5-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
            <input class="filter-input" id="searchFilter" type="search" placeholder="Search filename..."/>
          </div>
          <select class="filter-select" id="statusFilter">
            <option value="">All Status</option>
            <option value="complete">Complete</option>
            <option value="processing">Processing</option>
            <option value="queued">Queued</option>
            <option value="failed">Failed</option>
          </select>
          <select class="filter-select" id="dateFilter">
            <option value="0">All time</option>
            <option value="30">Last 30 days</option>
            <option value="7">Last 7 days</option>
            <option value="1">Today</option>
            <option value="90">Last 90 days</option>
            <option value="0">All time</option>
          </select>
          <select class="filter-select" id="sortFilter">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
            <option value="cost-desc">Highest cost</option>
            <option value="cost-asc">Lowest cost</option>
            <option value="name-asc">Name A → Z</option>
            <option value="pages-desc">Most pages</option>
          </select>
        </div>
      </div>

      <div class="tbl-wrap">
        <table class="tbl" id="jobsTable">
          <thead>
            <tr>
              <th style="width:36px"><input type="checkbox" id="masterCb" class="cb"/></th>
              <th>File</th>
              <th>Status</th>
              <th>Pages</th>
              <th>Cost</th>
              <th>Submitted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="jobsBody">
            <tr><td></td><td><span class="skeleton" style="height:13px;width:200px;display:block;margin-bottom:5px"></span><span class="skeleton" style="height:10px;width:120px;display:block"></span></td><td><span class="skeleton" style="height:20px;width:76px;border-radius:10px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:28px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:48px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:76px;display:block;margin-bottom:4px"></span><span class="skeleton" style="height:10px;width:55px;display:block"></span></td><td><span class="skeleton" style="height:28px;width:80px;border-radius:8px;display:block"></span></td></tr>
            <tr><td></td><td><span class="skeleton" style="height:13px;width:170px;display:block;margin-bottom:5px"></span><span class="skeleton" style="height:10px;width:100px;display:block"></span></td><td><span class="skeleton" style="height:20px;width:76px;border-radius:10px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:28px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:48px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:76px;display:block;margin-bottom:4px"></span><span class="skeleton" style="height:10px;width:55px;display:block"></span></td><td><span class="skeleton" style="height:28px;width:80px;border-radius:8px;display:block"></span></td></tr>
            <tr><td></td><td><span class="skeleton" style="height:13px;width:225px;display:block;margin-bottom:5px"></span><span class="skeleton" style="height:10px;width:90px;display:block"></span></td><td><span class="skeleton" style="height:20px;width:76px;border-radius:10px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:28px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:48px;display:block"></span></td><td><span class="skeleton" style="height:13px;width:76px;display:block;margin-bottom:4px"></span><span class="skeleton" style="height:10px;width:55px;display:block"></span></td><td><span class="skeleton" style="height:28px;width:80px;border-radius:8px;display:block"></span></td></tr>
          </tbody>
        </table>
      </div>

      <div class="card-footer">
        <span class="text-sm text-subtle" id="tableFootMeta">-</span>
        <div style="flex:1"></div>
        <button class="btn btn-ghost btn-sm" id="exportFilteredBtn">↓ Export filtered CSV</button>
      </div>
    </div>

  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/enterprise-runtime.js"></script>
<script>
(function () {
  'use strict';
  Shell.init('history');

  const session = Session.get();
  const email   = session?.email || '';
  const $       = id => document.getElementById(id);

  /* ── In-memory job list from Supabase ── */
  let allJobs    = [];
  let dataLoaded = false;

  /* ── Fetch all jobs from Supabase via jobs-list API ── */
  async function fetchJobs() {
    try {
      const days = parseInt($('dateFilter')?.value || '0', 10);
      const res  = await paFetch(APP_CONFIG.FLOWS.JOB_LIST, { email, days: days || 365 });
      if (Array.isArray(res)) {
        allJobs    = res;
        dataLoaded = true;
        renderTable();
        // Resume polling for in-progress jobs
        allJobs.forEach(j => {
          const st = (j.status || '').toLowerCase();
          if (st === 'queued' || st === 'processing') startPolling(j.jobId);
        });
      }
    } catch (err) {
      /* error handled silently */
      showToast('Failed to load jobs. Please refresh.', 'error');
    }
  }

  /* ── Poll job status for in-progress jobs ── */
  const activePolls = new Map();
  function startPolling(jobId) {
    if (activePolls.has(jobId)) return;
    let attempts = 0;
    const timer = setInterval(async () => {
      attempts++;
      if (attempts > 144) { clearInterval(timer); activePolls.delete(jobId); return; }
      try {
        const res = await paFetch(APP_CONFIG.FLOWS.JOB_STATUS, { jobId, email });
        if (!res) return;
        const status    = res.status || '';
        const resultUrl = res.result_url || res.resultUrl || null;
        const pageCount = res.page_count || res.pageCount || 0;
        const costTotal = res.cost_total || res.costTotal || null;
        // Update in-memory
        const idx = allJobs.findIndex(j => j.jobId === jobId);
        if (idx >= 0) allJobs[idx] = { ...allJobs[idx], status, resultUrl, pageCount, costTotal };
        renderTable();
        if (['complete','failed','error'].includes(status.toLowerCase())) {
          clearInterval(timer); activePolls.delete(jobId);
          if (status.toLowerCase() === 'complete') showToast('Redaction complete!', 'success', 5000);
        }
      } catch {}
    }, APP_CONFIG.APP.POLL_INTERVAL_MS);
    activePolls.set(jobId, timer);
  }

  /* ── Auto refresh every 30s ── */
  setInterval(fetchJobs, 30_000);

  /* ── Selected row set ── */
  const selected = new Set();

  /* ── Filter / sort jobs ── */
  function applyFilters(jobs) {
    const q      = ($('searchFilter')?.value || '').toLowerCase().trim();
    const status = ($('statusFilter')?.value || '').toLowerCase();
    const days   = parseInt($('dateFilter')?.value || '30', 10);
    const sort   = $('sortFilter')?.value || 'date-desc';
    const cutoff = days ? Date.now() - days * 86_400_000 : 0;

    let filtered = jobs.filter(j => {
      if (q && !(j.fileName || '').toLowerCase().includes(q)) return false;
      if (status && (j.status || '').toLowerCase() !== status) return false;
      if (cutoff && new Date(j.submittedAt).getTime() < cutoff) return false;
      return true;
    });

    filtered.sort((a, b) => {
      if (sort === 'date-desc')  return new Date(b.submittedAt) - new Date(a.submittedAt);
      if (sort === 'date-asc')   return new Date(a.submittedAt) - new Date(b.submittedAt);
      if (sort === 'cost-desc')  return (+(b.costTotal||0)) - (+(a.costTotal||0));
      if (sort === 'cost-asc')   return (+(a.costTotal||0)) - (+(b.costTotal||0));
      if (sort === 'name-asc')   return (a.fileName||'').localeCompare(b.fileName||'');
      if (sort === 'pages-desc') return (+(b.pageCount||0)) - (+(a.pageCount||0));
      return 0;
    });

    return filtered;
  }

  /* ── Status pill ── */
  function pill(status) {
    const s = (status || '').toLowerCase();
    if (s === 'complete')   return `<span class="pill pill-complete"><span class="pill-dot"></span>Complete</span>`;
    if (s === 'processing') return `<span class="pill pill-processing"><span class="pill-dot"></span>Processing</span>`;
    if (s === 'queued')     return `<span class="pill pill-processing"><span class="pill-dot"></span>Queued</span>`;
    if (s === 'failed')     return `<span class="pill pill-failed">Failed</span>`;
    return `<span class="pill pill-processing"><span class="pill-dot"></span>Queued</span>`;
  }

  /* ── Render stats ── */
  function renderStats(jobs) {
    const done  = jobs.filter(j => (j.status||'').toLowerCase() === 'complete');
    const total = jobs.length;
    const cost  = done.reduce((s,j) => s+(+(j.costTotal||0)), 0);
    const rate  = total ? Math.round(done.length/total*100) : 0;
    const avg   = done.length ? cost/done.length : 0;

    const set = (id,v) => { const el=$(id); if(el) el.textContent=v; };
    set('stTotal',       String(total));
    set('stTotalNote',   `${total} document${total!==1?'s':''}`);
    set('stSuccess',     total ? rate+'%' : '0%');
    set('stSuccessNote', done.length ? `${done.length} of ${total} succeeded` : 'No completed jobs');
    set('stCost',        '$'+cost.toFixed(2));
    set('stCostNote',    `${done.length} completed job${done.length!==1?'s':''}`);
    set('stAvg',         done.length ? fmt.usd(avg) : '-');
  }

  /* ── Render table ── */
  function renderTable() {
    const filtered = applyFilters(allJobs);
    const tbody    = $('jobsBody');
    const badge    = $('jobCountBadge');
    const meta     = $('tableFootMeta');
    if (!tbody) return;

    if (badge) badge.textContent = filtered.length;
    if (meta)  meta.textContent  = `${filtered.length} job${filtered.length!==1?'s':''} matching filters`;

    renderStats(allJobs);

    if (!dataLoaded) {
      // Keep skeleton rows showing - don't replace with spinner
      return;
    }

    if (!allJobs.length) {
      // BUG-02: New user - zero jobs ever. Show CTA with link to dashboard.
      tbody.innerHTML = `<tr><td colspan="7"><div class="tbl-empty" style="padding:48px 24px">
        <svg width="80" height="68" viewBox="0 0 120 100" fill="none" style="margin-bottom:14px;opacity:.6">
          <rect x="20" y="10" width="52" height="66" rx="6" fill="var(--surface2)" stroke="var(--border2)" stroke-width="1.5"/>
          <rect x="28" y="24" width="28" height="3" rx="1.5" fill="var(--border2)"/>
          <rect x="28" y="32" width="36" height="3" rx="1.5" fill="var(--border2)"/>
          <rect x="28" y="40" width="22" height="3" rx="1.5" fill="var(--border2)"/>
          <circle cx="85" cy="68" r="22" fill="var(--blue-bg)" stroke="var(--blue-bd)" stroke-width="1.5"/>
          <path d="M85 58v16M78 65l7-7 7 7" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="tbl-empty-title" style="font-size:15px;font-weight:700;margin-bottom:6px">No jobs yet</div>
        <div class="tbl-empty-sub" style="margin-bottom:16px">Upload your first document to see your redaction history here.</div>
        <a href="/dashboard" class="btn btn-primary btn-sm">Upload your first document →</a>
      </div></td></tr>`;
      if (meta) meta.textContent = 'No jobs in history';
      return;
    }

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="tbl-empty">
        <div class="tbl-empty-icon"><svg width="24" height="24" fill="none" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M21 21l-4.5-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
        <div class="tbl-empty-title">No jobs match your filters</div>
        <div class="tbl-empty-sub">Try adjusting the search or date range above</div>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(j => {
      const chk  = selected.has(j.jobId) ? 'checked' : '';
      const s    = (j.status||'').toLowerCase();
      const isProc = s === 'queued' || s === 'processing';
      const dur  = (j.submittedAt && j.completedAt)
        ? fmt.duration(new Date(j.completedAt) - new Date(j.submittedAt))
        : '-';

      const actions = s === 'complete'
        ? `<div class="flex gap-5">
            ${j.resultUrl ? `<button class="btn btn-sm btn-primary dl-btn" data-id="${j.jobId}" title="Download redacted PDF">↓ PDF</button>` : ''}
            <button class="btn btn-sm btn-secondary view-btn" data-id="${j.jobId}">View</button>
            <button class="btn btn-sm btn-ghost detail-toggle" data-id="${j.jobId}">···</button>
          </div>`
        : isProc
          ? `<div class="flex gap-5"><span class="text-xs text-subtle" style="display:flex;align-items:center;gap:5px"><div class="spinner" style="width:11px;height:11px;border-width:1.5px;margin:0"></div>Processing...</span><button class="btn btn-sm btn-ghost detail-toggle" data-id="${j.jobId}">···</button></div>`
          : `<button class="btn btn-sm btn-ghost detail-toggle" data-id="${j.jobId}">···</button>`;

      return `<tr id="row-${j.jobId}">
        <td><input type="checkbox" class="cb row-cb" data-id="${j.jobId}" ${chk}/></td>
        <td>
          <div class="tbl-filename">${fmt.trunc(j.fileName||'-',40)}</div>
          <div class="tbl-meta">${fmt.bytes(j.fileSize)} · ${j.blobUrl ? 'Blob stored' : '-'}</div>
        </td>
        <td>${pill(j.status)}</td>
        <td><span class="font-mono text-sm">${j.pageCount||'-'}</span></td>
        <td><span class="font-mono text-sm">${j.costTotal!=null ? fmt.usd(j.costTotal) : '-'}</span></td>
        <td>
          <div class="text-sm text-ink2">${fmt.date(j.submittedAt)}</div>
          <div class="tbl-meta">${fmt.time(j.submittedAt)} · ${dur}</div>
        </td>
        <td>${actions}</td>
      </tr>`;
    }).join('');

    // Wire download buttons - generate SAS URL on demand
    tbody.querySelectorAll('.dl-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const j = allJobs.find(x => x.jobId === btn.dataset.id);
        if (!j?.resultUrl) { showToast('Result not available','warn'); return; }
        btn.disabled = true;
        btn.textContent = '...';
        try {
          const parts     = j.resultUrl.split('/');
          const blobName  = parts[parts.length-1].split('?')[0];
          const container = parts[parts.length-2];
          const sasRes    = await paFetch(APP_CONFIG.FLOWS.BLOB_SAS, { email, blobName, container, mode:'read' });
          if (sasRes?.sasUrl) window.open(sasRes.sasUrl, '_blank');
          else showToast('Could not generate download link','error');
        } catch { showToast('Download failed','error'); }
        btn.disabled = false;
        btn.textContent = '↓ PDF';
      });
    });

    // Wire view buttons
    tbody.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => { location.href = `/viewer?jobId=${encodeURIComponent(btn.dataset.id)}`; });
    });

    // Wire detail toggles
    tbody.querySelectorAll('.detail-toggle').forEach(btn => {
      btn.addEventListener('click', () => toggleDetail(btn.dataset.id, filtered));
    });

    // Wire row checkboxes
    tbody.querySelectorAll('.row-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) selected.add(cb.dataset.id);
        else selected.delete(cb.dataset.id);
        updateBulkBar();
      });
    });
  }

  /* ── Expandable detail row ── */
  function toggleDetail(jobId, filtered) {
    const existing = document.getElementById(`detail-${jobId}`);
    if (existing) { existing.remove(); return; }
    const j = filtered.find(x => x.jobId === jobId);
    if (!j) return;

    const fields    = Array.isArray(j.extractedFields) ? j.extractedFields : [];
    const fieldsHtml = fields.length
      ? `<div style="grid-column:1/-1">
          <div class="detail-key" style="margin-bottom:8px">Extracted Fields (${fields.length})</div>
          <table class="fields-table">
            <thead><tr><th>Field</th><th>Value</th><th>Confidence</th></tr></thead>
            <tbody>${fields.map(f=>`<tr><td>${f.key||f.name||'-'}</td><td>${f.value||'-'}</td><td><span class="font-mono text-sm">${f.confidence!=null?(f.confidence*100).toFixed(1)+'%':'-'}</span></td></tr>`).join('')}</tbody>
          </table>
        </div>` : '';

    const row = document.getElementById(`row-${jobId}`);
    if (!row) return;
    row.insertAdjacentHTML('afterend', `
<tr class="detail-row" id="detail-${jobId}">
  <td colspan="7">
    <div class="detail-inner">
      <div class="detail-field"><div class="detail-key">Job ID</div><div class="detail-val mono">${j.jobId}</div></div>
      <div class="detail-field"><div class="detail-key">Submitted</div><div class="detail-val">${fmt.datetime(j.submittedAt)}</div></div>
      <div class="detail-field"><div class="detail-key">Completed</div><div class="detail-val">${j.completedAt ? fmt.datetime(j.completedAt) : '-'}</div></div>
      <div class="detail-field"><div class="detail-key">File Size</div><div class="detail-val mono">${fmt.bytes(j.fileSize)}</div></div>
      <div class="detail-field"><div class="detail-key">Pages</div><div class="detail-val mono">${j.pageCount||'-'}</div></div>
      <div class="detail-field"><div class="detail-key">Total Cost</div><div class="detail-val mono">${j.costTotal!=null?fmt.usd(j.costTotal):'-'}</div></div>
      ${j.errorMessage?`<div class="detail-field" style="grid-column:1/-1"><div class="detail-key" style="color:var(--red)">Error</div><div class="detail-val" style="color:var(--red)">${j.errorMessage}</div></div>`:''}
      ${j.blobUrl?`<div class="detail-field"><div class="detail-key">Input Blob</div><div class="detail-val mono" style="font-size:11px;word-break:break-all"><a href="${j.blobUrl}" target="_blank" style="color:var(--blue)">${j.blobUrl}</a></div></div>`:''}
      ${j.resultUrl?`<div class="detail-field"><div class="detail-key">Result Blob</div><div class="detail-val mono" style="font-size:11px;word-break:break-all"><a href="${j.resultUrl}" target="_blank" style="color:var(--green)">${j.resultUrl}</a></div></div>`:''}
      ${fieldsHtml}
    </div>
  </td>
</tr>`);
  }

  /* ── Bulk bar ── */
  function updateBulkBar() {
    const bar = $('bulkBar');
    if (!bar) return;
    bar.classList.toggle('visible', selected.size > 0);
    const cEl = $('bulkCount');
    if (cEl) cEl.textContent = `${selected.size} selected`;
    const mc = $('masterCb');
    if (mc) mc.indeterminate = selected.size > 0;
  }

  /* ── CSV export ── */
  function toCSVRows(jobs) {
    return jobs.map(j => ({
      JobId        : j.jobId,
      FileName     : j.fileName,
      SizeMB       : fmt.mb(j.fileSize),
      Pages        : j.pageCount || '',
      Status       : j.status,
      CostUSD      : j.costTotal ?? '',
      Submitted    : fmt.datetime(j.submittedAt),
      Completed    : j.completedAt ? fmt.datetime(j.completedAt) : '',
      ResultURL    : j.resultUrl   || '',
      ErrorMessage : j.errorMessage || '',
    }));
  }

  /* ── Events ── */
  const debouncedRender = debounce(renderTable, 200);
  $('searchFilter')?.addEventListener('input',  debouncedRender);
  $('statusFilter')?.addEventListener('change', renderTable);
  $('dateFilter')?.addEventListener('change',   () => { fetchJobs(); });
  $('sortFilter')?.addEventListener('change',   renderTable);

  $('refreshBtn')?.addEventListener('click', () => { fetchJobs(); showToast('Refreshed from Supabase', 'info', 1800); });
  $('exportAllBtn')?.addEventListener('click',      () => exportCSV(toCSVRows(allJobs), 'prudent-all-jobs.csv'));
  $('exportFilteredBtn')?.addEventListener('click', () => exportCSV(toCSVRows(applyFilters(allJobs)), 'prudent-filtered-jobs.csv'));

  $('masterCb')?.addEventListener('change', e => {
    const filtered = applyFilters(allJobs);
    if (e.target.checked) filtered.forEach(j => selected.add(j.jobId));
    else selected.clear();
    renderTable(); updateBulkBar();
  });
  $('selectAllBtn')?.addEventListener('click', () => { applyFilters(allJobs).forEach(j => selected.add(j.jobId)); renderTable(); updateBulkBar(); });
  $('deselectBtn')?.addEventListener('click',  () => { selected.clear(); renderTable(); updateBulkBar(); });
  $('bulkClearBtn')?.addEventListener('click', () => { selected.clear(); renderTable(); updateBulkBar(); });
  $('bulkExportBtn')?.addEventListener('click',() => { exportCSV(toCSVRows(allJobs.filter(j => selected.has(j.jobId))), 'prudent-selected-jobs.csv'); });

  // Pre-fill search from URL param
  const urlQ = new URLSearchParams(location.search).get('q');
  if (urlQ && $('searchFilter')) $('searchFilter').value = urlQ;

  /* ── Initial load ── */
  fetchJobs();

})();
</script>
</body>
</html>
