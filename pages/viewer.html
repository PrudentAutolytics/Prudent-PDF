<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Document Viewer — Prudent PDF</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
.viewer-layout{display:flex;flex-direction:column;height:calc(100vh - var(--topbar-h));overflow:hidden}
.viewer-main{display:grid;grid-template-columns:1fr 380px;flex:1;min-height:0;overflow:hidden}
.viewer-docs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--border);overflow:hidden}
.viewer-panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.viewer-pane{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
</style>
</head>
<body>
<div class="shell" id="appShell">
  <main class="main" style="padding:0;overflow:hidden;display:flex;flex-direction:column">
    <!-- Toolbar -->
    <div class="viewer-top">
      <a href="/history" class="btn btn-ghost btn-sm">← History</a>
      <div class="divider" style="width:1px;height:20px;margin:0;background:var(--border)"></div>
      <div id="viewerFileName" style="font-size:13.5px;font-weight:600;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">No document loaded</div>
      <span class="pill" id="viewerStatus" style="display:none"></span>
      <div style="flex:1"></div>
      <select class="filter-select" id="jobSelector" style="max-width:220px">
        <option value="">— Select a completed job —</option>
      </select>
      <button class="btn btn-secondary btn-sm" id="dlOrigBtn" disabled>↓ Original</button>
      <button class="btn btn-primary btn-sm" id="dlRedactBtn" disabled>↓ Redacted PDF</button>
      <button class="btn btn-secondary btn-sm" id="exportFieldsBtn" disabled>↓ Fields CSV</button>
    </div>

    <!-- Main -->
    <div class="viewer-main" style="flex:1;min-height:0">
      <!-- Docs pane -->
      <div class="viewer-docs">
        <!-- Original -->
        <div class="viewer-pane">
          <div class="viewer-pane-hd">
            <div class="viewer-pane-label pane-original">
              <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="1.75"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.75"/></svg>
              Original
            </div>
            <div class="zoom-group">
              <button class="zoom-step" id="oZoomOut">−</button>
              <span class="zoom-val" id="oZoomVal">100%</span>
              <button class="zoom-step" id="oZoomIn">+</button>
            </div>
          </div>
          <div class="pane-scroll" id="origScroll">
            <div class="no-job" id="origEmpty">
              <svg width="40" height="40" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="1.5"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.5"/></svg>
              <p style="font-size:13px">Select a completed job<br/>to view the original document</p>
            </div>
            <div id="origContent" class="hidden" style="width:100%;max-width:560px"></div>
          </div>
          <div class="pane-footer">
            <div class="page-nav">
              <button class="zoom-step" id="oPrev">‹</button>
              <span class="page-val" id="oPage">1 / 1</span>
              <button class="zoom-step" id="oNext">›</button>
            </div>
          </div>
        </div>

        <!-- Redacted -->
        <div class="viewer-pane">
          <div class="viewer-pane-hd">
            <div class="viewer-pane-label pane-redacted">
              <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="2" rx="1" fill="currentColor"/><rect x="6" y="7" width="12" height="2" rx="1" fill="currentColor"/><rect x="8" y="15" width="8" height="2" rx="1" fill="currentColor"/></svg>
              Redacted
            </div>
            <div class="zoom-group">
              <button class="zoom-step" id="rZoomOut">−</button>
              <span class="zoom-val" id="rZoomVal">100%</span>
              <button class="zoom-step" id="rZoomIn">+</button>
            </div>
          </div>
          <div class="pane-scroll" id="redScroll">
            <div class="no-job" id="redEmpty">
              <svg width="40" height="40" fill="none" viewBox="0 0 24 24" style="opacity:.3"><rect x="3" y="11" width="18" height="2" rx="1" fill="currentColor"/><rect x="6" y="7" width="12" height="2" rx="1" fill="currentColor"/><rect x="8" y="15" width="8" height="2" rx="1" fill="currentColor"/></svg>
              <p style="font-size:13px">Redacted version<br/>will appear here</p>
            </div>
            <div id="redContent" class="hidden" style="width:100%;max-width:560px"></div>
          </div>
          <div class="pane-footer">
            <div class="page-nav">
              <button class="zoom-step" id="rPrev">‹</button>
              <span class="page-val" id="rPage">1 / 1</span>
              <button class="zoom-step" id="rNext">›</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right panel -->
      <div class="viewer-panel">
        <div class="ptabs">
          <button class="ptab active" data-tab="fields">Extracted Fields</button>
          <button class="ptab" data-tab="cost">Cost</button>
          <button class="ptab" data-tab="meta">Metadata</button>
        </div>
        <div class="panel-content">
          <div class="panel-section active" id="tab-fields">
            <div class="no-job" style="height:auto;padding:28px 0"><p style="font-size:13px">Load a job to see extracted fields</p></div>
          </div>
          <div class="panel-section" id="tab-cost">
            <div class="no-job" style="height:auto;padding:28px 0"><p style="font-size:13px">Load a job to see cost breakdown</p></div>
          </div>
          <div class="panel-section" id="tab-meta">
            <div class="no-job" style="height:auto;padding:28px 0"><p style="font-size:13px">Load a job to see metadata</p></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast-area"></div>
<script src="/js/config.js"></script>
<script src="/js/shell.js"></script>
<script>
Shell.init('viewer');
(function(){
  const s=Session.get();
  let jobs=[],currentJob=null,oZoom=100,rZoom=100;

  async function loadJobs(){
    try{const r=await paFetch(APP_CONFIG.FLOWS.JOB_LIST,{email:s.email,days:30});jobs=(Array.isArray(r)?r:(r?.jobs||[])).filter(j=>j.status==='Complete')}
    catch{jobs=(JSON.parse(localStorage.getItem('pp_jobs_'+s.email)||'[]')).filter(j=>j.status==='Complete')}
    const sel=document.getElementById('jobSelector');
    sel.innerHTML='<option value="">— Select a completed job —</option>';
    jobs.forEach(j=>{const o=document.createElement('option');o.value=j.jobId;o.textContent=`${j.fileName} · ${fmt.date(j.submittedAt)}`;sel.appendChild(o)});
    const urlId=new URLSearchParams(location.search).get('jobId');
    if(urlId){sel.value=urlId;loadJob(urlId)}
  }

  document.getElementById('jobSelector').addEventListener('change',e=>{if(e.target.value)loadJob(e.target.value)});

  function loadJob(id){
    const j=jobs.find(x=>x.jobId===id);if(!j)return;
    currentJob=j;
    document.getElementById('viewerFileName').textContent=j.fileName;
    const st=document.getElementById('viewerStatus');
    st.style.display='';st.className='pill pill-complete';st.innerHTML='<span class="pill-dot"></span>Complete';
    document.getElementById('dlRedactBtn').disabled=!j.resultUrl;
    document.getElementById('dlOrigBtn').disabled=!j.blobUrl;
    document.getElementById('exportFieldsBtn').disabled=false;
    if(j.resultUrl)document.getElementById('dlRedactBtn').onclick=()=>window.open(j.resultUrl,'_blank');
    if(j.blobUrl)document.getElementById('dlOrigBtn').onclick=()=>window.open(j.blobUrl,'_blank');
    renderOrig(j);renderRedact(j);renderFields(j);renderCost(j);renderMeta(j);
  }

  function mockRows(j,redact){
    const rows=[['Document Ref','DOC-2025-001234',false],['Client Name','John Michael Smith',true],['Date of Birth','15/03/1985',true],['National ID','AB123456C',true],['Email','john.smith@company.com',true],['Phone','+44 7700 900123',true],['Account No','12-34-56 / 78901234',true],['Document Type','Loan Application',false],['Submission Date',fmt.date(j.submittedAt),false],['Total Amount','£45,000.00',false]];
    return rows.map(([k,v,pii])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11.5px"><span style="color:var(--ink3)">${k}</span><span style="font-weight:600;color:var(--ink)">${redact&&pii?`<span class="redact-bar">${'█'.repeat(Math.max(4,v.length))}</span>`:v}</span></div>`).join('');
  }

  function renderOrig(j){
    document.getElementById('origEmpty').classList.add('hidden');
    const el=document.getElementById('origContent');el.classList.remove('hidden');
    el.innerHTML=`<div class="pdf-mock" style="transform:scale(${oZoom/100});transform-origin:top center"><div class="pdf-mock-title">${j.fileName}</div>${mockRows(j,false)}</div>`;
    document.getElementById('oPage').textContent=`1 / ${j.pageCount??1}`;
  }
  function renderRedact(j){
    document.getElementById('redEmpty').classList.add('hidden');
    const el=document.getElementById('redContent');el.classList.remove('hidden');
    el.innerHTML=`<div class="pdf-mock" style="transform:scale(${rZoom/100});transform-origin:top center"><div class="pdf-mock-title">${j.fileName} <span style="color:var(--red);font-size:10px;font-weight:700">[REDACTED]</span></div>${mockRows(j,true)}</div>`;
    document.getElementById('rPage').textContent=`1 / ${j.pageCount??1}`;
  }

  function renderFields(j){
    const fields=[{key:'Client Name',value:'John Michael Smith',sensitive:true,conf:.97},{key:'Date of Birth',value:'15/03/1985',sensitive:true,conf:.94},{key:'National ID',value:'AB123456C',sensitive:true,conf:.91},{key:'Email Address',value:'john.smith@company.com',sensitive:true,conf:.99},{key:'Phone Number',value:'+44 7700 900123',sensitive:true,conf:.88},{key:'Account Number',value:'12-34-56 / 78901234',sensitive:true,conf:.85},{key:'Document Type',value:'Loan Application Form',sensitive:false,conf:.99},{key:'Submission Date',value:fmt.date(j.submittedAt),sensitive:false,conf:.99}];
    document.getElementById('tab-fields').innerHTML=`<div style="padding:14px"><div class="flex-between mb-12"><span style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)">${fields.length} fields extracted</span><span class="pill pill-complete" style="font-size:10px">Avg ${Math.round(fields.reduce((a,f)=>a+f.conf,0)/fields.length*100)}%</span></div>${fields.map(f=>`<div class="field-row"><div class="flex-between gap-8"><div><div class="field-key">${f.key}</div><div class="field-val ${f.sensitive?'':''}"><span ${f.sensitive?'style="color:var(--red);font-weight:600"':''}>${f.value}</span></div></div>${f.sensitive?'<span class="pill pill-failed" style="font-size:9.5px">PII</span>':'<span class="pill pill-complete" style="font-size:9.5px">Safe</span>'}</div><div class="field-conf mt-4"><div class="conf-bar"><div class="conf-track"><div class="conf-fill ${f.conf<.7?'low':f.conf<.85?'mid':''}" style="width:${Math.round(f.conf*100)}%"></div></div><span class="conf-pct">${Math.round(f.conf*100)}%</span></div></div></div>`).join('')}</div>`;
  }

  function renderCost(j){
    const c=calcJobCost(j.pageCount??1,parseFloat(fmt.mb(j.fileSize??0)));
    document.getElementById('tab-cost').innerHTML=`<div style="padding:14px"><div class="cost-total-card"><div class="cost-total-label">Total Job Cost</div><div class="cost-total-val">${c.totalFmt}</div><div class="cost-total-sub">${j.pageCount??1} page${(j.pageCount??1)!==1?'s':''} · ${fmt.mb(j.fileSize??0)} MB · 20% overhead included</div></div>${[['Azure Doc Intelligence','#2563EB',c.docIntel,'$'+c.docIntel.toFixed(5)],['Azure Blob Storage','#0891B2',c.blob,'$'+c.blob.toFixed(5)],['Azure Functions','#7C3AED',c.functions,'$'+c.functions.toFixed(5)],['Power Automate','#D97706',c.paFlow,'$'+c.paFlow.toFixed(5)],['SendGrid Email','#059669',c.email,'$'+c.email.toFixed(5)]].map(([l,col,v,d])=>`<div class="cost-service-row"><div class="cost-service-label"><div class="cost-swatch" style="background:${col}"></div><span>${l}</span></div><div class="cost-service-amt">${d}</div></div>`).join('')}<div class="cost-service-row" style="border-top:2px solid var(--border);margin-top:4px;font-weight:700;padding-top:12px"><div class="cost-service-label"><div class="cost-swatch" style="background:var(--amber)"></div><span>Total (with overhead)</span></div><div class="cost-service-amt" style="color:var(--amber)">${c.totalFmt}</div></div></div>`;
  }

  function renderMeta(j){
    const rows=[['Job ID',j.jobId||'—'],['File Name',j.fileName],['File Size',fmt.bytes(j.fileSize||0)],['Page Count',j.pageCount??'—'],['Status',j.status],['Submitted',fmt.datetime(j.submittedAt)],['Completed',j.completedAt?fmt.datetime(j.completedAt):'—'],['Account',s.email]];
    document.getElementById('tab-meta').innerHTML=`<div style="padding:14px">${rows.map(([k,v])=>`<div class="field-row"><div class="field-key">${k}</div><div class="field-val">${v}</div></div>`).join('')}</div>`;
  }

  document.querySelectorAll('.ptab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.panel-section').forEach(s=>s.classList.remove('active'));
      tab.classList.add('active');document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
    });
  });

  function setOZoom(z){oZoom=Math.min(200,Math.max(50,z));document.getElementById('oZoomVal').textContent=oZoom+'%';if(currentJob)renderOrig(currentJob)}
  function setRZoom(z){rZoom=Math.min(200,Math.max(50,z));document.getElementById('rZoomVal').textContent=rZoom+'%';if(currentJob)renderRedact(currentJob)}
  document.getElementById('oZoomIn').addEventListener('click',()=>setOZoom(oZoom+25));
  document.getElementById('oZoomOut').addEventListener('click',()=>setOZoom(oZoom-25));
  document.getElementById('rZoomIn').addEventListener('click',()=>setRZoom(rZoom+25));
  document.getElementById('rZoomOut').addEventListener('click',()=>setRZoom(rZoom-25));

  document.getElementById('exportFieldsBtn').addEventListener('click',()=>{
    if(!currentJob)return;
    exportCSV([{Field:'Client Name',Value:'John Michael Smith',Sensitive:'Yes',Confidence:'97%'},{Field:'Date of Birth',Value:'15/03/1985',Sensitive:'Yes',Confidence:'94%'},{Field:'Document Type',Value:'Loan Application Form',Sensitive:'No',Confidence:'99%'}],`fields-${currentJob.fileName}.csv`);
  });

  loadJobs();
})();
</script>
</body>
</html>
