<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Document Viewer — Prudent PDF</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
.main{padding:0!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;height:calc(100vh - var(--topbar-h))!important}
</style>
</head>
<body>
<div class="shell" id="appShell">
  <main class="main viewer-main-wrap">
    <!-- Toolbar -->
    <div class="viewer-top">
      <a href="/history" class="btn btn-ghost btn-sm">← History</a>
      <div style="width:1px;height:20px;background:var(--border);flex-shrink:0"></div>
      <div id="viewerFileName" style="font-family:var(--display);font-size:13.5px;font-weight:700;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">No document loaded</div>
      <span class="pill" id="viewerStatusPill" style="display:none"></span>
      <span class="text-xs text-mono text-subtle" id="viewerMeta" style="display:none"></span>
      <div style="flex:1"></div>
      <select class="filter-select" id="jobSelector" style="max-width:240px;font-size:12.5px" aria-label="Select job">
        <option value="">— Select a completed job —</option>
      </select>
      <button class="btn btn-secondary btn-sm" id="dlOrigBtn" disabled aria-label="Download original PDF">↓ Original</button>
      <button class="btn btn-primary btn-sm"   id="dlRedactBtn" disabled aria-label="Download redacted PDF">↓ Redacted PDF</button>
      <button class="btn btn-secondary btn-sm" id="exportFieldsBtn" disabled aria-label="Export fields CSV">↓ Fields CSV</button>
    </div>

    <!-- Viewer main area -->
    <div class="viewer-body-grid" style="display:grid;grid-template-columns:1fr 380px;flex:1;min-height:0;overflow:hidden">

      <!-- Document panes -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--border);overflow:hidden">
        <!-- Original -->
        <div class="viewer-pane">
          <div class="viewer-pane-hd">
            <div class="viewer-pane-label pane-original">
              <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="1.9"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.9"/></svg>
              ORIGINAL
            </div>
            <div class="zoom-group">
              <button class="zoom-step" id="oZoomOut" aria-label="Zoom out">−</button>
              <span class="zoom-val" id="oZoomVal">100%</span>
              <button class="zoom-step" id="oZoomIn" aria-label="Zoom in">+</button>
            </div>
          </div>
          <div class="pane-scroll" id="origScroll">
            <div class="no-job" id="origEmpty">
              <svg width="42" height="42" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="1.4"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.4"/></svg>
              <p style="font-size:13px;line-height:1.65">Select a completed job<br/>to view the original document</p>
            </div>
            <div id="origContent" class="hidden"></div>
          </div>
          <div class="pane-footer">
            <div class="page-nav">
              <button class="zoom-step" id="oPrev" aria-label="Previous page">‹</button>
              <span class="page-val" id="oPage">1 / 1</span>
              <button class="zoom-step" id="oNext" aria-label="Next page">›</button>
            </div>
            <div style="flex:1"></div>
            <span class="text-xs text-mono text-subtle" id="origSizeLabel"></span>
          </div>
        </div>

        <!-- Redacted -->
        <div class="viewer-pane">
          <div class="viewer-pane-hd">
            <div class="viewer-pane-label pane-redacted">
              <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><rect x="2" y="10" width="20" height="4" rx="2" fill="currentColor"/><rect x="5" y="6" width="14" height="2" rx="1" fill="currentColor" opacity=".4"/><rect x="7" y="16" width="10" height="2" rx="1" fill="currentColor" opacity=".4"/></svg>
              REDACTED
            </div>
            <div class="zoom-group">
              <button class="zoom-step" id="rZoomOut" aria-label="Zoom out">−</button>
              <span class="zoom-val" id="rZoomVal">100%</span>
              <button class="zoom-step" id="rZoomIn" aria-label="Zoom in">+</button>
            </div>
          </div>
          <div class="pane-scroll" id="redScroll">
            <div class="no-job" id="redEmpty">
              <svg width="42" height="42" fill="none" viewBox="0 0 24 24" style="opacity:.3"><rect x="2" y="10" width="20" height="4" rx="2" fill="currentColor"/><rect x="5" y="6" width="14" height="2" rx="1" fill="currentColor"/><rect x="7" y="16" width="10" height="2" rx="1" fill="currentColor"/></svg>
              <p style="font-size:13px;line-height:1.65">Redacted version<br/>will appear here</p>
            </div>
            <div id="redContent" class="hidden"></div>
          </div>
          <div class="pane-footer">
            <div class="page-nav">
              <button class="zoom-step" id="rPrev" aria-label="Previous page">‹</button>
              <span class="page-val" id="rPage">1 / 1</span>
              <button class="zoom-step" id="rNext" aria-label="Next page">›</button>
            </div>
            <div style="flex:1"></div>
            <span class="text-xs text-mono text-subtle" id="redSizeLabel"></span>
          </div>
        </div>
      </div>

      <!-- Right panel -->
      <div class="viewer-panel">
        <div class="ptabs">
          <button class="ptab active" data-tab="fields">Fields</button>
          <button class="ptab" data-tab="cost">Cost</button>
          <button class="ptab" data-tab="meta">Metadata</button>
        </div>
        <div class="panel-content">
          <div class="panel-section active" id="tab-fields">
            <div class="no-job" style="height:auto;padding:28px 0">
              <svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <p style="font-size:12.5px;text-align:center;line-height:1.65">Extracted fields appear here<br/>after a job is loaded</p>
            </div>
          </div>
          <div class="panel-section" id="tab-cost">
            <div class="no-job" style="height:auto;padding:28px 0"><p style="font-size:12.5px;text-align:center">Load a job to see cost breakdown</p></div>
          </div>
          <div class="panel-section" id="tab-meta">
            <div class="no-job" style="height:auto;padding:28px 0"><p style="font-size:12.5px;text-align:center">Load a job to see metadata</p></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/shell.js"></script>
<script>
Shell.init('viewer');
(function(){
  const s = Session.get();
  let jobs = [], currentJob = null, oZoom = 100, rZoom = 100;

  // Load completed jobs for selector
  async function loadJobs() {
    try {
      const r = await paFetch(APP_CONFIG.FLOWS.JOB_LIST, { email: s.email, days: 30 });
      jobs = (Array.isArray(r) ? r : (r?.jobs || [])).filter(j => j.status === 'Complete');
    } catch {
      jobs = JSON.parse(localStorage.getItem('pp_jobs_' + s.email) || '[]').filter(j => j.status === 'Complete');
    }
    const sel = document.getElementById('jobSelector');
    sel.innerHTML = '<option value="">— Select a completed job —</option>';
    jobs.forEach(j => {
      const o = document.createElement('option');
      o.value = j.jobId;
      o.textContent = `${j.fileName}  ·  ${fmt.date(j.submittedAt)}  ·  ${j.pageCount ? j.pageCount+'pp' : '?pp'}`;
      sel.appendChild(o);
    });
    const urlId = new URLSearchParams(location.search).get('jobId');
    if (urlId) { sel.value = urlId; loadJob(urlId); }
  }

  document.getElementById('jobSelector').addEventListener('change', e => { if (e.target.value) loadJob(e.target.value); });

  function loadJob(id) {
    const j = jobs.find(x => x.jobId === id);
    if (!j) return;
    currentJob = j;
    document.getElementById('viewerFileName').textContent = j.fileName || 'Document';

    const pill = document.getElementById('viewerStatusPill');
    pill.style.display = 'inline-flex';
    pill.className = 'pill pill-complete';
    pill.innerHTML = '<span class="pill-dot"></span> Complete';

    const meta = document.getElementById('viewerMeta');
    meta.style.display = 'block';
    meta.textContent = `${fmt.bytes(j.fileSize||0)} · ${j.pageCount??'?'} pages · ${fmt.date(j.submittedAt)}`;

    document.getElementById('dlOrigBtn').disabled    = !j.blobUrl;
    document.getElementById('dlRedactBtn').disabled  = !j.resultUrl;
    document.getElementById('exportFieldsBtn').disabled = false;

    if (j.blobUrl)   document.getElementById('dlOrigBtn').onclick   = () => window.open(j.blobUrl, '_blank');
    if (j.resultUrl) document.getElementById('dlRedactBtn').onclick = () => window.open(j.resultUrl, '_blank');

    document.getElementById('origSizeLabel').textContent = fmt.bytes(j.fileSize||0);

    renderOriginal(j); renderRedacted(j); renderFields(j); renderCost(j); renderMeta(j);
  }

  // Sample document data for preview
  const sampleRows = [
    { key:'Document Ref',   value:'DOC-2025-001234',        pii:false },
    { key:'Client Name',    value:'John Michael Smith',      pii:true  },
    { key:'Date of Birth',  value:'15/03/1985',              pii:true  },
    { key:'National ID',    value:'AB 12 34 56 C',           pii:true  },
    { key:'Email Address',  value:'john.smith@company.com',  pii:true  },
    { key:'Phone Number',   value:'+44 7700 900 123',        pii:true  },
    { key:'Account No.',    value:'12-34-56 / 78901234',     pii:true  },
    { key:'Sort Code',      value:'12-34-56',                pii:true  },
    { key:'Document Type',  value:'Loan Application',        pii:false },
    { key:'Submission Date',value:'',                        pii:false, dynamic:true },
    { key:'Loan Amount',    value:'£45,000.00',              pii:false },
    { key:'Reference',      value:'REF-PA-2025-08-001',      pii:false },
  ];

  function buildDoc(j, redact) {
    const rows = sampleRows.map(r => {
      const val = r.dynamic ? fmt.date(j.submittedAt) : r.value;
      const display = redact && r.pii
        ? `<span class="redact-bar">${'█'.repeat(Math.max(6, val.length))}</span>`
        : `<span style="font-weight:600;color:var(--ink)">${val}</span>`;
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);gap:10px;font-size:12px">
        <span style="color:var(--ink3);flex-shrink:0;min-width:120px">${r.key}</span>
        <span style="text-align:right">${display}</span>
      </div>`;
    }).join('');
    const badge = redact ? `<span style="font-size:9px;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid var(--red-bd);padding:2px 7px;border-radius:4px;margin-left:8px;font-family:var(--display);letter-spacing:.06em">REDACTED</span>` : '';
    return `<div class="pdf-mock" style="transform:scale(${(redact?rZoom:oZoom)/100});transform-origin:top center">
      <div class="pdf-mock-title">${j.fileName}${badge}</div>
      ${rows}
    </div>`;
  }

  function renderOriginal(j) {
    document.getElementById('origEmpty').classList.add('hidden');
    const el = document.getElementById('origContent'); el.classList.remove('hidden');
    el.innerHTML = buildDoc(j, false);
    document.getElementById('oPage').textContent = `1 / ${j.pageCount ?? 1}`;
  }
  function renderRedacted(j) {
    document.getElementById('redEmpty').classList.add('hidden');
    const el = document.getElementById('redContent'); el.classList.remove('hidden');
    el.innerHTML = buildDoc(j, true);
    document.getElementById('rPage').textContent = `1 / ${j.pageCount ?? 1}`;
  }

  function renderFields(j) {
    const fields = [
      { key:'Client Name',    value:'John Michael Smith',     pii:true,  conf:.97 },
      { key:'Date of Birth',  value:'15/03/1985',             pii:true,  conf:.94 },
      { key:'National ID',    value:'AB 12 34 56 C',          pii:true,  conf:.91 },
      { key:'Email Address',  value:'john.smith@company.com', pii:true,  conf:.99 },
      { key:'Phone Number',   value:'+44 7700 900 123',       pii:true,  conf:.88 },
      { key:'Account No.',    value:'12-34-56 / 78901234',    pii:true,  conf:.85 },
      { key:'Document Type',  value:'Loan Application',       pii:false, conf:.99 },
      { key:'Loan Amount',    value:'£45,000.00',             pii:false, conf:.97 },
      { key:'Submission Date',value:fmt.date(j.submittedAt),  pii:false, conf:.99 },
    ];
    const piiCount = fields.filter(f => f.pii).length;
    const avgConf = Math.round(fields.reduce((a,f) => a+f.conf, 0) / fields.length * 100);
    document.getElementById('tab-fields').innerHTML = `
      <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div>
          <div style="font-family:var(--display);font-size:12px;font-weight:700;color:var(--ink)">${fields.length} fields extracted</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:2px">${piiCount} PII fields redacted</div>
        </div>
        <div class="flex gap-6">
          <span class="pill pill-complete" style="font-size:10px">Avg ${avgConf}% conf.</span>
          <span class="pill pill-failed" style="font-size:10px">${piiCount} PII</span>
        </div>
      </div>
      <div style="padding:0 14px">
        ${fields.map(f => `
          <div class="field-row">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
              <div>
                <div class="field-key">${f.key}</div>
                <div class="field-val ${f.pii && f.conf > 0.8 ? 'redacted' : ''}">${f.pii && f.conf > 0.8 ? '██████' : f.value}</div>
              </div>
              ${f.pii
                ? `<span class="pill pill-failed" style="font-size:9px;flex-shrink:0">PII</span>`
                : `<span class="pill pill-complete" style="font-size:9px;flex-shrink:0">Safe</span>`}
            </div>
            <div class="field-conf mt-4">
              <div class="conf-bar">
                <div class="conf-track"><div class="conf-fill ${f.conf<.7?'low':f.conf<.85?'mid':''}" style="width:${Math.round(f.conf*100)}%"></div></div>
                <span class="conf-pct">${Math.round(f.conf*100)}%</span>
              </div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  function renderCost(j) {
    const c = calcJobCost(j.pageCount ?? 1, parseFloat(fmt.mb(j.fileSize ?? 0)));
    const items = [
      ['#3B82F6', 'Azure Doc Intelligence', c.docIntel],
      ['#06B6D4', 'Azure Blob Storage',     c.blob],
      ['#8B5CF6', 'Azure Functions',        c.functions],
      ['#F59E0B', 'Power Automate',         c.paFlow],
      ['#10B981', 'SendGrid Email',         c.email],
    ];
    document.getElementById('tab-cost').innerHTML = `
      <div style="padding:14px">
        <div class="cost-total-card">
          <div class="cost-total-label">Total Job Cost</div>
          <div class="cost-total-val">${c.totalFmt}</div>
          <div class="cost-total-sub">${j.pageCount??1} page${(j.pageCount??1)!==1?'s':''} · ${fmt.mb(j.fileSize??0)} MB · 20% overhead included</div>
        </div>
        ${items.map(([col,label,val]) => `
          <div class="cost-service-row">
            <div class="cost-service-label"><div class="cost-swatch" style="background:${col}"></div><span>${label}</span></div>
            <div class="cost-service-amt">$${val.toFixed(5)}</div>
          </div>`).join('')}
        <div class="cost-service-row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:12px;font-weight:700">
          <div class="cost-service-label"><div class="cost-swatch" style="background:var(--amber)"></div><span>Total (with overhead)</span></div>
          <div class="cost-service-amt" style="color:var(--amber);font-size:13px">${c.totalFmt}</div>
        </div>
      </div>`;
  }

  function renderMeta(j) {
    const rows = [
      ['Job ID',       j.jobId  || '—'],
      ['File Name',    j.fileName],
      ['File Size',    fmt.bytes(j.fileSize || 0)],
      ['Page Count',   j.pageCount ?? '—'],
      ['Status',       j.status],
      ['Submitted',    fmt.datetime(j.submittedAt)],
      ['Completed',    j.completedAt ? fmt.datetime(j.completedAt) : '—'],
      ['Duration',     j.completedAt ? fmt.duration(new Date(j.completedAt) - new Date(j.submittedAt)) : '—'],
      ['Account',      s.email],
      ['Plan',         s.plan || '—'],
    ];
    document.getElementById('tab-meta').innerHTML = `
      <div style="padding:14px">
        ${rows.map(([k,v]) => `<div class="field-row"><div class="field-key">${k}</div><div class="field-val">${v}</div></div>`).join('')}
      </div>`;
  }

  // Tab switching
  document.querySelectorAll('.ptab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel-section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Zoom controls
  function setOZoom(z) {
    oZoom = Math.min(200, Math.max(50, z));
    document.getElementById('oZoomVal').textContent = oZoom + '%';
    if (currentJob) renderOriginal(currentJob);
  }
  function setRZoom(z) {
    rZoom = Math.min(200, Math.max(50, z));
    document.getElementById('rZoomVal').textContent = rZoom + '%';
    if (currentJob) renderRedacted(currentJob);
  }
  document.getElementById('oZoomIn').addEventListener('click', () => setOZoom(oZoom + 25));
  document.getElementById('oZoomOut').addEventListener('click', () => setOZoom(oZoom - 25));
  document.getElementById('rZoomIn').addEventListener('click', () => setRZoom(rZoom + 25));
  document.getElementById('rZoomOut').addEventListener('click', () => setRZoom(rZoom - 25));

  // Export fields
  document.getElementById('exportFieldsBtn').addEventListener('click', () => {
    if (!currentJob) return;
    exportCSV([
      { Field:'Client Name',    Value:'[REDACTED]',           Sensitive:'Yes', Confidence:'97%' },
      { Field:'Date of Birth',  Value:'[REDACTED]',           Sensitive:'Yes', Confidence:'94%' },
      { Field:'National ID',    Value:'[REDACTED]',           Sensitive:'Yes', Confidence:'91%' },
      { Field:'Email Address',  Value:'[REDACTED]',           Sensitive:'Yes', Confidence:'99%' },
      { Field:'Document Type',  Value:'Loan Application',     Sensitive:'No',  Confidence:'99%' },
      { Field:'Loan Amount',    Value:'£45,000.00',           Sensitive:'No',  Confidence:'97%' },
    ], `fields-${currentJob.fileName}.csv`);
  });

  loadJobs();
})();
</script>
</body>
</html>
