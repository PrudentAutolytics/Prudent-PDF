<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Loading</title>
<link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div class="shell" id="appShell" style="display:none"></div>
<div id="bootScreen" style="min-height:100vh;display:grid;place-items:center;background:var(--page-bg)">
  <div class="spinner" style="margin:auto"></div>
</div>
<script src="/js/config.js"></script>
<script src="/js/shell.js"></script>
<script>
// Auth check runs before ANY content is shown
if (!Session.valid()) { location.replace('/login'); }
else {
  document.getElementById('bootScreen').style.display = 'none';
  document.getElementById('appShell').style.display = '';
}
</script>
<script>
(function () {
  'use strict';
  Shell.init('viewer');

  const session = Session.get();
  const email   = session?.email || '';
  const $       = id => document.getElementById(id);

  let allJobs    = [];
  let currentJob = null;
  let origSasUrl = null;
  let redSasUrl  = null;

  /* ── Fetch jobs from Supabase ── */
  async function fetchJobs() {
    try {
      const res = await paFetch(APP_CONFIG.FLOWS.JOB_LIST, { email, days: 30 });
      if (Array.isArray(res)) {
        allJobs = res;
        populateSelector();
        // Auto-load from URL param
        const urlJobId = new URLSearchParams(location.search).get('jobId');
        if (urlJobId) {
          const sel = $('jobSelector');
          if (sel) {
            const opt = [...sel.options].find(o => o.value === urlJobId);
            if (opt) sel.value = urlJobId;
          }
          await loadJob(urlJobId);
        } else {
          // Show empty state if no URL param
          showInitialEmpty();
        }
      }
    } catch (err) {
      /* error handled silently */
      const sel = $('jobSelector');
      if (sel) sel.innerHTML = '<option value="">Failed to load — refresh</option>';
      showInitialEmpty();
    }
  }

  /* ── BUG-06: Empty state — shows CTA to upload when no jobs, otherwise prompts to select ── */
  function showInitialEmpty() {
    $('origLoading')?.classList.add('hidden');
    $('redLoading')?.classList.add('hidden');

    const origEmpty = $('origEmpty');
    const origMsg   = $('origEmptyMsg');
    origEmpty?.classList.remove('hidden');

    if (!allJobs.length) {
      // No jobs at all — guide user to dashboard
      if (origMsg) origMsg.innerHTML = `
        <div style="font-weight:700;font-size:14px;color:var(--ink);margin-bottom:6px">No document loaded</div>
        <div style="font-size:12.5px;color:var(--ink3);line-height:1.65;margin-bottom:14px">Process your first file to view results here.</div>
        <a href="/dashboard" class="btn btn-primary btn-sm">Upload a document →</a>`;
    } else {
      if (origMsg) origMsg.textContent = 'Select a job from the dropdown above';
    }

    $('redEmpty')?.classList.remove('hidden');
  }

  /* ── Populate selector ── */
  function populateSelector() {
    const sel = $('jobSelector');
    if (!sel) return;
    if (!allJobs.length) {
      sel.innerHTML = '<option value="">No jobs yet</option>';
      return;
    }
    const opts = allJobs.map(j => {
      const s    = (j.status||'').toLowerCase();
      const icon = s==='complete'?'✓':s==='queued'?'⏳':s==='processing'?'⚙':'●';
      return `<option value="${j.jobId}">${icon} ${fmt.trunc(j.fileName,36)} — ${fmt.date(j.submittedAt)}</option>`;
    }).join('');
    sel.innerHTML = '<option value="">— Select a job —</option>' + opts;
  }

  /* ── Get read SAS URL ── */
  async function getReadSasUrl(blobUrl, container) {
    if (!blobUrl) return null;
    try {
      const parts    = blobUrl.split('/');
      const blobName = parts[parts.length-1].split('?')[0];
      const cont     = container || parts[parts.length-2];
      const res = await paFetch(APP_CONFIG.FLOWS.BLOB_SAS, { email, blobName, container: cont, mode: 'read' });
      return res?.sasUrl || null;
    } catch { return null; }
  }

  /* ── Load job into viewer ── */
  async function loadJob(jobId) {
    if (!jobId) return;
    const j = allJobs.find(x => x.jobId === jobId);
    if (!j) { showToast('Job not found','warn'); return; }
    currentJob = j;

    const status = (j.status||'').toLowerCase();

    // Update toolbar info
    setText('viewerFileName', fmt.trunc(j.fileName, 38));
    const stEl = $('viewerStatus');
    if (stEl) {
      stEl.className   = `pill ${status==='complete'?'pill-complete':status==='processing'?'pill-processing':'pill-queued'}`;
      stEl.textContent = j.status || 'Queued';
      stEl.classList.remove('hidden');
    }
    const metaEl = $('viewerMeta');
    if (metaEl) {
      metaEl.textContent = `${fmt.bytes(j.fileSize)} · ${fmt.pages(j.pageCount||0)} · ${fmt.date(j.submittedAt)}`;
      metaEl.classList.remove('hidden');
    }

    // Show loading spinners
    setPaneLoading('orig', true);
    setPaneLoading('red',  true);

    origSasUrl = null;
    redSasUrl  = null;

    // Fetch both SAS URLs in parallel for speed
    const [oSas, rSas] = await Promise.all([
      j.blobUrl   ? getReadSasUrl(j.blobUrl,   'prudent-uploads')  : Promise.resolve(null),
      j.resultUrl ? getReadSasUrl(j.resultUrl, 'prudent-results') : Promise.resolve(null),
    ]);

    origSasUrl = oSas;
    redSasUrl  = rSas;

    // Render original
    if (origSasUrl) {
      loadPdfFrame('orig', origSasUrl, fmt.bytes(j.fileSize));
    } else {
      setPaneEmpty('orig', j.blobUrl ? 'Could not load original PDF' : 'Original not available');
    }

    // Render redacted
    if (redSasUrl) {
      loadPdfFrame('red', redSasUrl, 'Redacted');
    } else {
      setPaneEmpty('red',
        status==='complete'   ? 'Could not load redacted PDF' :
        status==='processing' ? 'Redaction in progress…' :
        status==='queued'     ? 'Job is queued — check back soon' :
        'Redacted PDF appears after job completes'
      );
    }

    // Buttons
    $('dlOrigBtn').disabled   = !origSasUrl;
    $('dlRedactBtn').disabled = !redSasUrl;
    $('exportFieldsBtn').disabled = false;
    if (origSasUrl) $('dlOrigBtn').onclick   = () => window.open(origSasUrl, '_blank');
    if (redSasUrl)  $('dlRedactBtn').onclick = () => window.open(redSasUrl,  '_blank');

    // Page count
    const pages = j.pageCount || '?';
    setText('oPage', `${fmt.pages(j.pageCount||0)}`);
    setText('rPage', `${fmt.pages(j.pageCount||0)}`);

    renderFields(j);
    renderCostSummary(j);
  }

  function setPaneLoading(which, isLoading) {
    const loading = $(`${which}Loading`);
    const empty   = $(`${which}Empty`);
    const frame   = $(`${which}Frame`);
    if (isLoading) {
      loading?.classList.remove('hidden');
      empty?.classList.add('hidden');
      frame?.classList.add('hidden');
    }
  }

  function loadPdfFrame(which, sasUrl, sizeLabel) {
    const loading = $(`${which}Loading`);
    const empty   = $(`${which}Empty`);
    const frame   = $(`${which}Frame`);
    const sizeEl  = $(`${which}SizeLabel`);
    if (!frame) return;
    if (sizeEl) sizeEl.textContent = sizeLabel || '';

    const viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(sasUrl)}&embedded=true`;
    let loaded = false;

    frame.onload = () => {
      loaded = true;
      loading?.classList.add('hidden');
      frame.classList.remove('hidden');
    };

    // If Google Docs fails after 12s show download fallback
    setTimeout(() => {
      if (!loaded) {
        loading?.classList.add('hidden');
        frame.classList.add('hidden');
        const emptyEl = $(`${which}Empty`);
        const msgEl   = $(`${which}EmptyMsg`);
        emptyEl?.classList.remove('hidden');
        if (msgEl) msgEl.innerHTML = `
          <div style="font-size:13px;color:var(--ink3);margin-bottom:14px;line-height:1.6">
            Preview unavailable — viewer timed out.<br/>
            <span style="font-size:11.5px">Your file is ready to download.</span>
          </div>
          <a href="${sasUrl}" target="_blank" class="btn btn-primary btn-sm" download>
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download PDF
          </a>`;
      }
    }, 12000);

    frame.src = viewerUrl;
    empty?.classList.add('hidden');
  }

  function setPaneEmpty(which, msg) {
    $(`${which}Loading`)?.classList.add('hidden');
    $(`${which}Frame`)?.classList.add('hidden');
    const empty  = $(`${which}Empty`);
    const msgEl  = $(`${which}EmptyMsg`);
    empty?.classList.remove('hidden');
    if (msgEl) msgEl.textContent = msg;
  }

  function setText(id, val) { const el=$(id); if(el) el.textContent=val; }

  /* ── Zoom ── */
  ['o','r'].forEach(w => {
    let zoom = 100;
    $(`${w}ZoomIn`)?.addEventListener('click', () => {
      zoom = Math.min(200, zoom+20);
      const f = $(w==='o'?'origFrame':'redFrame');
      const l = $(w==='o'?'oZoomVal':'rZoomVal');
      if(f&&!f.classList.contains('hidden')){f.style.transform=`scale(${zoom/100})`;f.style.transformOrigin='top center';}
      if(l) l.textContent=zoom+'%';
    });
    $(`${w}ZoomOut`)?.addEventListener('click', () => {
      zoom = Math.max(50, zoom-20);
      const f = $(w==='o'?'origFrame':'redFrame');
      const l = $(w==='o'?'oZoomVal':'rZoomVal');
      if(f&&!f.classList.contains('hidden')){f.style.transform=`scale(${zoom/100})`;f.style.transformOrigin='top center';}
      if(l) l.textContent=zoom+'%';
    });
  });

  /* ── Extracted fields table ── */
  function renderFields(j) {
    const panel = $('fieldsPanel');
    const count = $('fieldCount');
    if (!panel) return;

    // Parse fields from Supabase — could be object, array, or string
    let fields = [];
    try {
      const raw = j.extractedFields || j.extracted_fields;
      if (!raw) fields = [];
      else if (typeof raw === 'string') fields = JSON.parse(raw);
      else if (Array.isArray(raw)) fields = raw;
      else if (typeof raw === 'object') fields = [raw];
    } catch { fields = []; }

    if (count) count.textContent = `${fields.length} field${fields.length!==1?'s':''}`;

    if (!fields.length) {
      panel.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 20px;color:var(--ink3);text-align:center">
        <svg width="28" height="28" fill="none" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-size:13px;line-height:1.65">No extracted fields<br/>returned for this job</div>
      </div>`;
      return;
    }

    const rows = fields.map((f, i) => {
      // Handle both {key,value,confidence} and {content,page,polygon} formats from PA
      const content = f.content || f.value || '—';
      const page    = f.page != null ? `p.${f.page+1}` : (f.pageNumber!=null ? `p.${f.pageNumber}` : '—');
      const conf    = f.confidence != null ? f.confidence : null;
      const confHtml = conf != null
        ? `<span style="font-family:var(--mono);font-size:10px;color:${conf>=0.9?'var(--green)':conf>=0.7?'var(--amber)':'var(--red)'}">${(conf*100).toFixed(0)}%</span>`
        : '<span style="color:var(--ink4)">—</span>';
      const label = f.key || f.name || f.type || `#${i+1}`;
      const bg    = i%2===0 ? 'var(--surface)' : 'var(--surface2)';
      return `<tr style="background:${bg};border-bottom:1px solid var(--border)">
        <td style="padding:6px 8px;font-size:10.5px;font-weight:700;color:var(--ink3);white-space:nowrap;vertical-align:top;max-width:70px;overflow:hidden;text-overflow:ellipsis">${label}</td>
        <td style="padding:6px 8px;font-size:11.5px;color:var(--ink);word-break:break-all;vertical-align:top">${content}</td>
        <td style="padding:6px 8px;font-size:10px;color:var(--ink3);text-align:center;white-space:nowrap;vertical-align:top">${page}</td>
        <td style="padding:6px 8px;text-align:center;vertical-align:top">${confHtml}</td>
      </tr>`;
    }).join('');

    panel.innerHTML = `
      <div style="padding:4px 2px 8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)">
        ${fields.length} PII entit${fields.length!==1?'ies':'y'} detected
      </div>
      <div style="border:1px solid var(--border);border-radius:var(--r8);overflow:hidden;font-size:0">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:var(--surface3);border-bottom:2px solid var(--border)">
              <th style="padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left">Type</th>
              <th style="padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left">Content (Redacted)</th>
              <th style="padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:center">Pg</th>
              <th style="padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:center">Conf</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="padding:8px 2px 0;font-size:10.5px;color:var(--ink3);line-height:1.6">
        ⚠ ${fields.length} entit${fields.length!==1?'ies':'y'} redacted from output document.
      </div>`;
  }

  /* ── Cost summary ── */
  function renderCostSummary(j) {
    const cs = $('costSummary');
    if (!cs) return;
    if (!j.costTotal && !j.pageCount) { cs.classList.add('hidden'); return; }
    cs.classList.remove('hidden');
    const cost = calcJobCost(j.pageCount||1, fmt.mb(j.fileSize));
    const set  = (id,v) => { const el=$(id); if(el) el.textContent=v; };
    set('csDocIntel',    fmt.usd(cost.docIntel));
    set('csBlobStorage', fmt.usd(cost.blob));
    set('csPaFlow',      fmt.usd(cost.paFlow));
    set('csEmail',       fmt.usd(cost.email));
    set('csTotal',       j.costTotal!=null ? fmt.usd(j.costTotal) : cost.totalFmt);
  }

  /* ── Export fields CSV ── */
  $('exportFieldsBtn')?.addEventListener('click', () => {
    if (!currentJob) { showToast('No job loaded','warn'); return; }
    let fields = [];
    try {
      const raw = currentJob.extractedFields || currentJob.extracted_fields;
      if (typeof raw === 'string') fields = JSON.parse(raw);
      else if (Array.isArray(raw)) fields = raw;
    } catch {}
    if (!fields.length) { showToast('No fields to export','warn'); return; }
    exportCSV(
      fields.map((f,i) => ({
        Type       : f.key||f.name||f.type||`Field ${i+1}`,
        Content    : f.content||f.value||'',
        Page       : f.page!=null?f.page+1:(f.pageNumber||''),
        Confidence : f.confidence!=null?(f.confidence*100).toFixed(1)+'%':'',
      })),
      `fields-${currentJob.jobId.slice(0,8)}.csv`
    );
  });

  /* ── Job selector ── */
  $('jobSelector')?.addEventListener('change', e => { if(e.target.value) loadJob(e.target.value); });

  /* ── Initial load ── */
  fetchJobs();

})();
</script>
</body>
</html>
