<script>
'use strict';

// Minimal auth utilities — self-contained for login page
const _ENDPOINTS = {
  AUTH_CHECK  : '/api/auth-check',
  AUTH_REQUEST: '/api/auth-request',
  AUTH_VERIFY : '/api/auth-verify',
};

const Session = (() => {
  const KEY = 'pp_session';
  return {
    set(data)  { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} },
    get()      { try { return JSON.parse(localStorage.getItem(KEY)||'null'); } catch { return null; } },
    clear()    { try { localStorage.removeItem(KEY); } catch {} },
    valid() {
      const s = this.get();
      if (!s || !s.email || !s.token) return false;
      if (s.expiresAt && Date.now() > s.expiresAt) { this.clear(); return false; }
      return true;
    },
  };
})();

// Already logged in — go to dashboard
if (Session.valid()) location.replace('/dashboard');

async function apiPost(url, body, timeoutMs = 30000) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify(body),
      signal : ctrl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) {
      let msg = `Error ${res.status}.`;
      try { const e = await res.json(); msg = e.error || msg; } catch {}
      throw new Error(msg);
    }
    return res.json();
  } catch (err) {
    clearTimeout(timer);
    if (err.name === 'AbortError') throw new Error('Request timed out. Please try again.');
    throw err;
  }
}

function showToast(message, type='info', duration=3800) {
  const COLORS = { info:'#2563EB', success:'#059669', warn:'#D97706', error:'#DC2626' };
  const ICONS  = { info:'●', success:'✓', warn:'⚠', error:'✕' };
  let c = document.getElementById('toast-container');
  if (!c) {
    c = document.createElement('div');
    c.id = 'toast-container';
    Object.assign(c.style, { position:'fixed', bottom:'24px', right:'24px', zIndex:'9999', display:'flex', flexDirection:'column', gap:'8px', maxWidth:'380px' });
    document.body.appendChild(c);
  }
  const t = document.createElement('div');
  const color = COLORS[type]||COLORS.info;
  Object.assign(t.style, { display:'flex', alignItems:'flex-start', gap:'10px', padding:'12px 16px', borderRadius:'12px', background:'#fff', border:'1px solid #e2e8f0', borderLeft:`3px solid ${color}`, boxShadow:'0 4px 24px rgba(0,0,0,.12)', fontFamily:'system-ui,sans-serif', fontSize:'13px', color:'#0f172a', maxWidth:'380px', lineHeight:'1.55' });
  t.innerHTML = `<span style="color:${color}">${ICONS[type]}</span><span>${message}</span>`;
  c.appendChild(t);
  setTimeout(() => t.remove(), duration);
}
</script>

<style>
/* ── Layout ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh; display: grid;
  grid-template-columns: 60fr 40fr;
  background: #fff;
  overflow: hidden;
}

/* ── Left panel ── */
.left-panel {
  background: linear-gradient(145deg, #0F172A 0%, #1E3A8A 45%, #1D4ED8 100%);
  display: flex; flex-direction: column;
  padding: 48px 56px;
  position: relative; overflow: hidden;
  border-right: none;
}
.left-grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 100% 100% at 0% 0%, black 20%, transparent 80%);
}
.left-glow {
  position: absolute; pointer-events: none;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,.20) 0%, transparent 70%);
  top: -100px; right: -150px;
}
.left-brand { position: relative; z-index: 1; margin-bottom: auto; }
.left-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; margin-bottom: 56px;
}
.left-logo-img {
  height: 34px; width: 116px; object-fit: contain;
  border-radius: 7px; display: block;
  background: #fff; padding: 4px 8px; box-sizing: border-box;
}
.left-tagline {
  font-size: clamp(28px, 3.5vw, 40px); font-weight: 900;
  color: #fff; letter-spacing: -1.5px; line-height: 1.15;
  margin-bottom: 16px;
}
.left-tagline span {
  background: linear-gradient(135deg, #93C5FD 0%, #C4B5FD 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.left-sub {
  font-size: 15px; color: rgba(255,255,255,.6);
  line-height: 1.7; margin-bottom: 48px; max-width: 340px;
}
.left-features { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
.left-feat {
  display: flex; align-items: center; gap: 12px;
  font-size: 14px; color: rgba(255,255,255,.8);
}
.left-feat-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.12);
  display: grid; place-items: center; flex-shrink: 0; color: #93C5FD;
}
.left-bottom {
  position: relative; z-index: 1; margin-top: 48px;
  padding-top: 28px; border-top: 1px solid rgba(255,255,255,.10);
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.left-trust {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: rgba(255,255,255,.45); font-weight: 500;
}
.left-trust svg { opacity: .6; color: #93C5FD; }

/* ── Right panel ── */
.right-panel {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 48px 40px; background: #fff; position: relative;
  border-left: 1px solid #E2E8F0; gap: 0;
}
.right-inner {
  display: flex; flex-direction: column; align-items: center;
  width: 100%; flex: 1; justify-content: center;
}
.right-top {
  width: 100%; max-width: 360px; text-align: right;
  font-size: 13px; color: #64748B; margin-bottom: 32px; flex-shrink: 0;
}
.right-top a { color: #2563EB; font-weight: 600; text-decoration: none; }
.right-top a:hover { text-decoration: underline; }

.form-wrap { width: 100%; max-width: 360px; }

.form-header { margin-bottom: 32px; }
.form-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #2563EB; margin-bottom: 8px;
}
.form-h1 {
  font-size: 26px; font-weight: 900; letter-spacing: -.6px;
  color: #0F172A; margin-bottom: 6px; line-height: 1.15;
}
.form-sub { font-size: 14px; color: #64748B; line-height: 1.6; }

/* Input overrides for login */
.login-input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid #E2E8F0; border-radius: 10px;
  font-size: 14px; font-family: inherit; color: #0F172A;
  background: #fff; transition: all .15s; outline: none;
}
.login-input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.login-input.invalid { border-color: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,.1); }
.login-input::placeholder { color: #94A3B8; }

.input-label {
  display: block; font-size: 12.5px; font-weight: 600;
  color: #374151; margin-bottom: 6px; letter-spacing: .01em;
}
.input-group { margin-bottom: 16px; }
.input-err {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: #EF4444; margin-top: 6px; font-weight: 500;
}

/* Buttons */
.btn-main {
  width: 100%; padding: 12px 20px; border-radius: 10px;
  font-size: 14px; font-weight: 700; color: #fff; font-family: inherit;
  background: linear-gradient(135deg, #2563EB, #4F46E5);
  border: none; cursor: pointer;
  box-shadow: 0 4px 14px rgba(37,99,235,.35);
  transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-main:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,.45); }
.btn-main:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* Divider */
.form-divider {
  display: flex; align-items: center; gap: 12px; margin: 20px 0;
}
.form-divider::before, .form-divider::after { content: ''; flex: 1; height: 1px; background: #E2E8F0; }
.form-divider span { font-size: 12px; color: #94A3B8; font-weight: 500; white-space: nowrap; }

/* Security badges */
.security-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.sec-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; color: #64748B;
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: 6px; padding: 4px 10px;
}

/* New user slide */
.reg-slide { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .36s cubic-bezier(.4,0,.2,1), opacity .26s ease, margin .26s; margin-top: 0; }
.reg-slide.open { max-height: 580px; opacity: 1; margin-top: 0; }
.new-user-banner {
  display: flex; align-items: center; gap: 10px;
  background: #EFF6FF; border: 1px solid #BFDBFE;
  border-radius: 10px; padding: 10px 14px;
  font-size: 13px; font-weight: 600; color: #1D4ED8;
  margin-bottom: 16px;
}
.trial-perks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.trial-perk {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: #374151; font-weight: 500;
}
.perk-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; background: #D1FAE5; border: 1px solid #6EE7B7; display: grid; place-items: center; }
.perk-dot svg { color: #059669; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* OTP */
.otp-header { text-align: center; margin-bottom: 24px; }
.otp-lock {
  width: 60px; height: 60px; border-radius: 50%;
  background: #EFF6FF; border: 1.5px solid #BFDBFE;
  display: grid; place-items: center; margin: 0 auto 16px;
  color: #2563EB; position: relative;
}
.otp-lock::after {
  content: ''; position: absolute; inset: -5px; border-radius: 50%;
  border: 1.5px dashed #BFDBFE; animation: spin 12s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.otp-email-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: 999px; padding: 4px 14px;
  font-size: 13px; font-weight: 600; color: #334155;
  font-family: monospace; margin-top: 6px;
}
.otp-digits { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
.otp-digit {
  width: 48px; height: 56px; border: 1.5px solid #E2E8F0;
  border-radius: 10px; background: #fff;
  font-size: 22px; font-weight: 800; color: #0F172A;
  text-align: center; outline: none;
  transition: all .15s; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  font-family: 'SF Mono', 'Fira Code', monospace;
}
.otp-digit:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.1); transform: translateY(-1px); }
.otp-digit.filled { border-color: #2563EB; background: #EFF6FF; color: #2563EB; }
.otp-digit.bad { border-color: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,.1); animation: shake .35s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
.otp-err { text-align: center; font-size: 13px; color: #EF4444; min-height: 20px; font-weight: 500; margin-top: 8px; }
.timer-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: #FFFBEB; border: 1px solid #FDE68A;
  border-radius: 999px; padding: 3px 12px;
  font-size: 12px; color: #D97706; font-weight: 600;
}
.otp-actions {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-top: 16px; font-size: 13px; color: #64748B;
}
.otp-link {
  color: #2563EB; background: none; border: none; padding: 0;
  font-size: 13px; font-family: inherit; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
.otp-link:hover { opacity: .75; }

/* Success */
.success-view { text-align: center; padding: 20px 0; }
.success-circle {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, #10B981, #059669);
  display: grid; place-items: center; margin: 0 auto 20px;
  box-shadow: 0 8px 24px rgba(16,185,129,.35);
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
.success-title { font-size: 22px; font-weight: 900; color: #0F172A; margin-bottom: 8px; letter-spacing: -.4px; }
.success-sub { font-size: 14px; color: #64748B; line-height: 1.6; margin-bottom: 20px; }

/* Footer */
.right-footer {
  width: 100%; max-width: 360px; text-align: center;
  font-size: 12px; color: #94A3B8; margin-top: 32px; flex-shrink: 0;
}
.right-footer a { color: #94A3B8; text-decoration: none; }
.right-footer a:hover { color: #64748B; }

/* Responsive */
@media (max-width: 780px) {
  body { grid-template-columns: 1fr; }
  .left-panel { display: none; }
  .right-panel { min-height: 100vh; padding: 40px 24px; }
  .right-top { text-align: center; }
  .right-footer { text-align: center; }
}
</style>
</head>

        </div>
      </div>

      <div class="otp-actions">
        <span>Didn't receive it?</span>
        <button class="otp-link" id="resendBtn">Resend code</button>
        <span style="color:#CBD5E1">·</span>
        <button class="otp-link" id="changeEmailBtn">Change email</button>
      </div>
    </div>

    <!-- STEP 3: SUCCESS -->
    <div id="stepDone" class="hidden">
      <div class="success-view">
        <div class="success-circle">
          <svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="success-title" id="successTitle">Signed in!</div>
        <p class="success-sub" id="successSub">Redirecting to your dashboard…</p>
        <div class="spinner" style="margin:0 auto" role="status"></div>
      </div>
    </div>

  </div><!-- /form-wrap -->
  </div><!-- /right-inner -->

  <div class="right-footer" id="rightFooter"></div>
</div>


<script>
(function(){
'use strict';

const t = localStorage.getItem('pp_theme') || 'light';
document.documentElement.setAttribute('data-theme', t);
if (Session.valid()) { location.replace('/dashboard'); return; }

try {
  if (sessionStorage.getItem('pp_expired')) {
    sessionStorage.removeItem('pp_expired');
    setTimeout(() => showToast('Your session has expired. Please sign in again.', 'warn', 6000), 400);
  }
} catch {}

const $ = id => document.getElementById(id);
let S = { email:'', isNew:false, name:'', company:'', useCase:'', checked:false, otpSent:false };
let tickTimer = null, checkDebounce = null;

function show(s) { ['stepEmail','stepOTP','stepDone'].forEach(id => $(id)?.classList.toggle('hidden', id !== s)); }
function eErr(msg) { $('emailErr').classList.remove('hidden'); $('emailErrTxt').textContent = msg; $('emailInput').classList.add('invalid'); $('emailInput').focus(); }
function eOk()  { $('emailErr').classList.add('hidden'); $('emailInput').classList.remove('invalid'); }

$('emailInput').addEventListener('input', () => {
  if (S.otpSent) return;
  eOk();
  S.checked = false; S.isNew = false;
  $('regSlide').classList.remove('open');
  $('stepTitle').textContent = 'Welcome back';
  $('stepSub').textContent = 'Enter your work email to continue — no password required.';
  $('contBtnTxt').textContent = 'Continue';
  clearTimeout(checkDebounce);
  const em = ($('emailInput').value || '').trim();
  if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return;
  checkDebounce = setTimeout(() => doCheck(em), 650);
});

async function doCheck(email) {
  if (S.otpSent) return;
  try {
    const d = await paFetch(_ENDPOINTS.AUTH_CHECK, { email });
    S.checked = true;
    if (d.exists) {
      S.isNew = false;
      $('stepTitle').textContent = 'Welcome back';
      $('stepSub').textContent = "We'll send a 6-digit code to your inbox — no password needed.";
      $('contBtnTxt').textContent = 'Send verification code';
      $('regSlide').classList.remove('open');
    } else {
      S.isNew = true;
      $('stepTitle').textContent = 'Create your account';
      $('stepSub').textContent = 'Start your 5-document free trial — no credit card required.';
      $('contBtnTxt').textContent = 'Create account & send code';
      $('regSlide').classList.add('open');
      setTimeout(() => $('regName')?.focus(), 360);
    }
  } catch(e) { S.checked = false; }
}

$('continueBtn').addEventListener('click', handleContinue);
$('emailInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleContinue(); });

async function handleContinue() {
  if (S.otpSent) return;
  const email = ($('emailInput').value || '').trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { eErr('Please enter a valid work email address.'); return; }
  eOk();
  S.email = email;

  const btn = $('continueBtn');
  function setLoading(txt) { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:15px;height:15px;border-width:2px;margin:0;border-color:rgba(255,255,255,.3);border-top-color:#fff"></div> ' + txt; }
  function resetBtn()      { btn.disabled = false; btn.innerHTML = '<svg width="15" height="15" fill="none" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> <span id="contBtnTxt">' + (S.isNew ? 'Create account & send code' : S.checked ? 'Send verification code' : 'Continue') + '</span>'; }

  if (!S.checked) { setLoading('Checking…'); await doCheck(email); resetBtn(); }

  if (S.isNew) {
    const name = ($('regName')?.value || '').trim();
    if (!name) {
      $('regName').classList.add('invalid');
      $('regName').focus();
      setTimeout(() => $('regName').classList.remove('invalid'), 2500);
      eErr('Please enter your full name to create an account.');
      return;
    }
    S.name    = name;
    S.company = ($('regCompany')?.value || '').trim();
    S.useCase = $('regUseCase')?.value || '';
  }

  S.otpSent = true;
  setLoading('Sending code…');
  try {
    await apiPost(_ENDPOINTS.AUTH_REQUEST, { email });
    $('otpEmailShow').textContent = email;
    clearDigits();
    show('stepOTP');
    startTimer();
    setTimeout(() => $('d0')?.focus(), 120);
  } catch(err) {
    S.otpSent = false;
    eErr(err.message || 'Could not send code. Please try again.');
    resetBtn();
  }
}

const ds = [0,1,2,3,4,5].map(i => $('d'+i));
ds.forEach((inp, i) => {
  inp.addEventListener('input', e => {
    const v = e.target.value.replace(/\D/g, '');
    inp.value = v ? v[0] : '';
    inp.classList.toggle('filled', !!inp.value);
    $('otpErr').textContent = '';
    if (inp.value && i < 5) ds[i+1].focus();
    $('verifyBtn').disabled = !ds.every(d => d.value);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && i > 0) { ds[i-1].value = ''; ds[i-1].classList.remove('filled'); ds[i-1].focus(); $('verifyBtn').disabled = true; }
    if (e.key === 'Enter' && !$('verifyBtn').disabled) verifyOTP();
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const p = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
    p.slice(0,6).split('').forEach((ch,j) => { if (ds[j]) { ds[j].value = ch; ds[j].classList.add('filled'); } });
    ds[Math.min(p.length,5)]?.focus();
    $('verifyBtn').disabled = !ds.every(d => d.value);
  });
});

function getCode()    { return ds.map(d => d.value).join(''); }
function clearDigits(){ ds.forEach(d => { d.value = ''; d.classList.remove('filled','bad'); }); $('verifyBtn').disabled = true; }
function shakeDigits(){ ds.forEach(d => { d.classList.add('bad'); setTimeout(() => d.classList.remove('bad'), 420); }); }

function startTimer(ms = 600000) {
  const dl = Date.now() + ms;
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    const r = Math.max(0, dl - Date.now());
    const el = $('timerTxt');
    if (el) el.textContent = Math.floor(r/60000) + ':' + String(Math.floor((r%60000)/1000)).padStart(2,'0');
    if (r === 0) { clearInterval(tickTimer); $('otpErr').textContent = 'Code expired — please request a new one.'; $('verifyBtn').disabled = true; }
  }, 1000);
}

$('verifyBtn').addEventListener('click', verifyOTP);
async function verifyOTP() {
  const code = getCode();
  if (code.length !== 6) return;
  const btn = $('verifyBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:15px;height:15px;border-width:2px;margin:0;border-color:rgba(255,255,255,.3);border-top-color:#fff"></div> Verifying…';
  try {
    const d = await apiPost(_ENDPOINTS.AUTH_VERIFY, { email: S.email, otp: code });
    if (d?.status === 'approved') {
      clearInterval(tickTimer);
      Session.set({
        email          : d.email || S.email,
        token          : d.token || d.userId || '',   // signed session token from auth-verify
        userId         : d.userId || '',
        plan           : d.plan   || 'trial',
        creditsUsed    : d.creditsUsed    ?? 0,
        creditsLimit   : d.creditsLimit   ?? APP_CONFIG.PLANS.trial.filesPerMonth,
        trialExpiryDate: d.trialExpiryDate || null,
        isNewUser      : S.isNew,
        expiresAt      : Date.now() + 30 * 24 * 3600000,  // 30 days, matches server
        fullName       : d.fullName || S.name || null,
      });
      const fn = d.fullName || S.name;
      const firstName = fn ? fn.split(' ')[0] : null;
      $('successTitle').textContent = S.isNew && firstName ? 'Welcome, ' + firstName + '!' : 'Signed in!';
      $('successSub').textContent   = S.isNew ? 'Your free trial is active. Redirecting…' : 'Redirecting to your dashboard…';
      show('stepDone');
      setTimeout(() => location.replace('/dashboard'), 1200);
    } else { throw new Error('Verification failed.'); }
  } catch(err) {
    shakeDigits();
    $('otpErr').textContent =
      err.message?.includes('Invalid') ? 'Incorrect code — please check and try again.' :
      err.message?.includes('expired') ? 'Code expired — request a new one.' :
      'Verification failed. Please try again.';
    btn.disabled = false;
    btn.innerHTML = '<svg width="15" height="15" fill="none" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Verify &amp; sign in';
    $('verifyBtn').disabled = !ds.every(d => d.value);
  }
}

$('resendBtn').addEventListener('click', async () => {
  $('otpErr').textContent = ''; clearDigits();
  $('resendBtn').disabled = true; $('resendBtn').textContent = 'Sending…';
  try {
    await apiPost(_ENDPOINTS.AUTH_REQUEST, { email: S.email });
    startTimer();
    showToast('New code sent to ' + S.email, 'success');
  } catch(e) { $('otpErr').textContent = 'Failed to resend. Try again.'; }
  $('resendBtn').disabled = false; $('resendBtn').textContent = 'Resend code';
});

$('changeEmailBtn').addEventListener('click', () => {
  clearInterval(tickTimer);
  S = { email:'', isNew:false, name:'', company:'', useCase:'', checked:false, otpSent:false };
  $('emailInput').value = '';
  $('regSlide').classList.remove('open');
  $('stepTitle').textContent = 'Welcome back';
  $('stepSub').textContent = 'Enter your work email to continue — no password required.';
  show('stepEmail');
  setTimeout(() => $('emailInput')?.focus(), 60);
});

})();
</script>

  // Right panel

  set('stepSub', 'Enter your work email to continue — no password required.');
  set('newUserBannerTxt', 'New account — 5 free documents included');
  set('rightFooter', '<a href="/pricing">Terms</a> · <a href="/contact">Privacy</a> · <a href="/contact">Support</a><br/>© 2026 Prudent Autolytics · Chennai, India');

  // Trial perks
  var pkMap = {'5fr':'Free tier included','aid':'AI detection','sbv':'Document viewer','ncc':'No credit card required'};
  d.querySelectorAll('.pk').forEach(function(e){ e.textContent = pkMap[e.textContent] || e.textContent; });
})();
</script>
