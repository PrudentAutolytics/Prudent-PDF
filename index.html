<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Prudent PDF</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue      : #2563EB;
  --blue-dark : #1D4ED8;
  --violet    : #7C3AED;
  --green     : #10B981;
  --ink       : #0F172A;
  --ink2      : #1E293B;
  --ink3      : #475569;
  --ink4      : #94A3B8;
  --surface   : #FFFFFF;
  --surface2  : #F8FAFC;
  --border    : #E2E8F0;
  --border2   : #CBD5E1;
}
html { scroll-behavior: smooth; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; background: #fff; color: var(--ink); overflow-x: hidden; line-height: 1.6; }

/* ── NAV ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 68px; display: flex; align-items: center; padding: 0 48px;
  background: rgba(255,255,255,.95); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.nav-brand { display: flex; align-items: center; gap: 0; text-decoration: none; flex-shrink: 0; }
.nav-logo { height: 36px; width: 108px; object-fit: contain; display: block; }
.nav-links { display: flex; align-items: center; gap: 32px; margin: 0 auto; }
.nav-links a { font-size: 14px; font-weight: 500; color: var(--ink3); text-decoration: none; transition: color .15s; letter-spacing: -.01em; }
.nav-links a:hover { color: var(--ink); }
.nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.btn-ghost { padding: 8px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink2); background: transparent; border: 1.5px solid var(--border2); cursor: pointer; text-decoration: none; transition: all .15s; }
.btn-ghost:hover { border-color: var(--blue); color: var(--blue); }
.btn-cta { padding: 8px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: #fff; background: var(--blue); border: none; cursor: pointer; text-decoration: none; transition: all .15s; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
.btn-cta:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,.4); }

/* ── HERO ── */
.hero {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 120px 24px 80px; position: relative; overflow: hidden;
  background: #fff;
}
.hero-grid-bg {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 60px 60px; opacity: .35;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 100%);
}
.hero-glow {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 70vw 50vh at 50% 30%, rgba(37,99,235,.07) 0%, transparent 70%),
              radial-gradient(ellipse 40vw 30vh at 80% 70%, rgba(124,58,237,.05) 0%, transparent 60%);
}
.hero-eyebrow {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(37,99,235,.06); border: 1px solid rgba(37,99,235,.15);
  border-radius: 999px; padding: 5px 14px 5px 10px;
  font-size: 12.5px; font-weight: 600; color: var(--blue);
  margin-bottom: 32px;
}
.hero-eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }

.hero-h1 {
  position: relative; z-index: 1;
  font-size: clamp(40px, 6.5vw, 76px); font-weight: 900;
  letter-spacing: -3px; line-height: 1.02; color: var(--ink);
  max-width: 820px; margin: 0 auto 24px;
}
.hero-h1 .grad {
  background: linear-gradient(135deg, var(--blue) 0%, var(--violet) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-sub {
  position: relative; z-index: 1;
  font-size: clamp(16px, 2vw, 19px); color: var(--ink3); font-weight: 400;
  max-width: 560px; margin: 0 auto 40px; line-height: 1.65;
}
.hero-actions {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
  margin-bottom: 56px;
}
.btn-primary-lg {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 14px 28px; border-radius: 10px;
  font-size: 15px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--blue), #4F46E5);
  border: none; cursor: pointer; text-decoration: none;
  box-shadow: 0 4px 20px rgba(37,99,235,.40);
  transition: all .18s;
}
.btn-primary-lg:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,99,235,.50); }
.btn-secondary-lg {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 14px 24px; border-radius: 10px;
  font-size: 15px; font-weight: 600; color: var(--ink2);
  background: #fff; border: 1.5px solid var(--border2);
  cursor: pointer; text-decoration: none;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  transition: all .18s;
}
.btn-secondary-lg:hover { border-color: var(--blue); color: var(--blue); transform: translateY(-1px); }

.hero-trust {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
  font-size: 12px; font-weight: 500; color: var(--ink4);
}
.hero-trust-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--border2); }
.hero-trust span { display: inline-flex; align-items: center; gap: 5px; }
.hero-trust svg { opacity: .5; }

/* ── LOGOS / SOCIAL PROOF ── */
.social-proof {
  background: var(--surface2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 28px 24px; text-align: center;
}
.social-proof-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink4); margin-bottom: 20px; }
.social-proof-grid { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; }
.social-proof-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 700; color: var(--ink3);
  opacity: .7;
}
.social-proof-icon {
  width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center;
  background: var(--border); color: var(--ink3);
}

/* ── PRODUCT SCREENSHOT ── */
.screenshot-section {
  padding: 80px 24px 0; background: #fff;
  display: flex; flex-direction: column; align-items: center;
}
.screenshot-section .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 14px; }
.screenshot-section h2 { font-size: clamp(28px, 4vw, 42px); font-weight: 900; letter-spacing: -1.5px; color: var(--ink); text-align: center; margin-bottom: 14px; max-width: 600px; }
.screenshot-section p { font-size: 16px; color: var(--ink3); text-align: center; max-width: 520px; margin-bottom: 48px; line-height: 1.65; }

.browser-frame {
  width: 100%; max-width: 1000px;
  background: #1E293B; border-radius: 16px 16px 0 0;
  overflow: hidden; box-shadow: 0 40px 100px rgba(15,23,42,.35);
  border: 1px solid rgba(255,255,255,.07);
}
.browser-chrome {
  background: #0F172A; padding: 13px 18px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,.05);
}
.browser-dots { display: flex; gap: 6px; }
.browser-dots span { width: 11px; height: 11px; border-radius: 50%; }
.browser-url {
  flex: 1; background: rgba(255,255,255,.06); border-radius: 6px;
  padding: 5px 12px; font-size: 11.5px; font-family: monospace;
  color: rgba(255,255,255,.35);
}
.browser-body { display: grid; grid-template-columns: 190px 1fr; min-height: 360px; }
.mock-sidebar {
  background: rgba(255,255,255,.025); border-right: 1px solid rgba(255,255,255,.05);
  padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;
}
.mock-sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 12px; }
.mock-sidebar-logo-box { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg,#2563EB,#7C3AED); }
.mock-sidebar-logo-text { font-size: 12px; font-weight: 700; color: #fff; }
.mock-nav-item { padding: 7px 10px; border-radius: 7px; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,.4); }
.mock-nav-item.active { background: rgba(37,99,235,.2); color: #60A5FA; font-weight: 600; }
.mock-main { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.mock-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.mock-stat { border-radius: 8px; padding: 12px; }
.mock-stat-val { font-size: 20px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
.mock-stat-label { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .65; }
.mock-table { background: rgba(255,255,255,.03); border-radius: 10px; overflow: hidden; flex: 1; }
.mock-table-hd { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: space-between; }
.mock-table-title { font-size: 12px; font-weight: 700; color: #fff; }
.mock-table-link { font-size: 11px; color: #60A5FA; }
.mock-row { display: grid; grid-template-columns: 1fr 80px 56px 64px; gap: 6px; align-items: center; padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,.04); }
.mock-row:last-child { border-bottom: none; }
.mock-filename { font-size: 11px; color: rgba(255,255,255,.75); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mock-pill { font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; text-align: center; }
.mock-pill.complete   { background: rgba(16,185,129,.15); color: #34D399; }
.mock-pill.processing { background: rgba(37,99,235,.2);  color: #60A5FA; }
.mock-cost { font-size: 11px; color: rgba(255,255,255,.4); font-family: monospace; }
.mock-action { font-size: 10px; color: #60A5FA; }

/* ── HOW IT WORKS ── */
.how-section { padding: 100px 24px; max-width: 980px; margin: 0 auto; }
.how-steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 32px; margin-top: 56px; position: relative; }
.how-steps::before {
  content: ''; position: absolute; top: 28px; left: calc(16.6% + 16px); right: calc(16.6% + 16px);
  height: 1px; background: linear-gradient(90deg, var(--border) 0%, var(--border2) 50%, var(--border) 100%);
  z-index: 0;
}
.how-step { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 1; }
.how-step-num {
  width: 56px; height: 56px; border-radius: 50%;
  background: #fff; border: 2px solid var(--border2);
  display: grid; place-items: center;
  font-size: 18px; font-weight: 900; color: var(--blue);
  margin-bottom: 20px; box-shadow: 0 2px 12px rgba(37,99,235,.12);
}
.how-step-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.how-step-desc { font-size: 13.5px; color: var(--ink3); line-height: 1.65; }

/* ── FEATURES ── */
.features-section { padding: 100px 24px; background: var(--surface2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.features-inner { max-width: 1080px; margin: 0 auto; }
.features-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; background: var(--border); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 56px; }
.feat-card { background: #fff; padding: 32px 28px; transition: background .15s; }
.feat-card:hover { background: #FAFBFF; }
.feat-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 18px; }
.feat-icon.blue   { background: rgba(37,99,235,.08);  color: var(--blue); }
.feat-icon.violet { background: rgba(124,58,237,.08); color: var(--violet); }
.feat-icon.green  { background: rgba(16,185,129,.08); color: #059669; }
.feat-icon.amber  { background: rgba(245,158,11,.08); color: #D97706; }
.feat-icon.red    { background: rgba(239,68,68,.08);  color: #DC2626; }
.feat-icon.cyan   { background: rgba(6,182,212,.08);  color: #0891B2; }
.feat-title { font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.feat-desc  { font-size: 13.5px; color: var(--ink3); line-height: 1.65; }

/* ── USE CASES ── */
.use-section { padding: 100px 24px; max-width: 1080px; margin: 0 auto; }
.use-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-top: 48px; }
.use-card {
  background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 24px 20px;
  transition: all .18s;
}
.use-card:hover { border-color: var(--blue); box-shadow: 0 8px 24px rgba(37,99,235,.1); transform: translateY(-2px); }
.use-card-icon { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 14px; }
.use-card-title { font-size: 13.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.use-card-desc  { font-size: 12.5px; color: var(--ink3); line-height: 1.6; }

/* ── API SECTION ── */
.api-section { padding: 100px 24px; background: var(--ink2); }
.api-inner { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
.api-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 14px; }
.api-h2 { font-size: clamp(26px, 3.5vw, 38px); font-weight: 900; letter-spacing: -1px; color: #fff; margin-bottom: 16px; line-height: 1.1; }
.api-p { font-size: 15px; color: rgba(255,255,255,.6); line-height: 1.7; margin-bottom: 28px; }
.api-feat { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; font-size: 13.5px; color: rgba(255,255,255,.75); }
.api-feat svg { flex-shrink: 0; margin-top: 2px; }
.api-feat strong { color: #fff; }
.btn-api { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); text-decoration: none; transition: all .15s; margin-top: 8px; }
.btn-api:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); }
.code-block { background: #0D1117; border-radius: 12px; padding: 20px 22px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.8; color: #E6EDF3; overflow-x: auto; border: 1px solid rgba(255,255,255,.06); }
.code-block .c { color: #8B949E; }
.code-block .k { color: #79C0FF; }
.code-block .s { color: #A5D6FF; }
.code-block .v { color: #FFA657; }

/* ── PLANS TEASER ── */
.plans-section { padding: 100px 24px; background: #fff; }
.plans-inner { max-width: 1080px; margin: 0 auto; }
.plans-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; margin-top: 48px; }
.plan-card { background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 22px 16px; transition: all .18s; position: relative; }
.plan-card:hover { border-color: var(--border2); box-shadow: 0 8px 24px rgba(0,0,0,.07); transform: translateY(-2px); }
.plan-card.featured { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.plan-popular { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,var(--blue),var(--violet)); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 12px; border-radius: 99px; white-space: nowrap; }
.plan-name  { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); margin-bottom: 10px; }
.plan-price { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: var(--ink); margin-bottom: 14px; line-height: 1; }
.plan-price sub { font-size: 13px; font-weight: 500; color: var(--ink3); letter-spacing: 0; }
.plan-limits { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.plan-limit  { font-size: 11.5px; color: var(--ink3); display: flex; justify-content: space-between; }
.plan-limit strong { color: var(--ink); font-weight: 700; font-family: monospace; font-size: 11px; }
.plan-sep { height: 1px; background: var(--border); margin-bottom: 14px; }
.plan-btn-link { display: block; text-align: center; padding: 9px; border-radius: 8px; font-size: 12.5px; font-weight: 700; text-decoration: none; transition: all .15s; }
.plan-btn-link.primary { background: linear-gradient(135deg,var(--blue),var(--violet)); color: #fff; box-shadow: 0 3px 10px rgba(37,99,235,.3); }
.plan-btn-link.primary:hover { transform: translateY(-1px); }
.plan-btn-link.ghost { background: var(--surface2); border: 1px solid var(--border2); color: var(--ink2); }
.plan-btn-link.ghost:hover { border-color: var(--blue); color: var(--blue); }

/* ── STATS BAR ── */
.stats-bar { background: linear-gradient(135deg, #1E3A8A 0%, #312E81 100%); padding: 56px 24px; }
.stats-inner { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(4,1fr); gap: 24px; text-align: center; }
.stat-num  { font-size: 42px; font-weight: 900; color: #fff; letter-spacing: -2px; line-height: 1; margin-bottom: 6px; }
.stat-desc { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.6); }

/* ── CTA ── */
.cta-section {
  padding: 100px 24px; text-align: center;
  background: linear-gradient(180deg, #fff 0%, var(--surface2) 100%);
  border-top: 1px solid var(--border);
}
.cta-h2 { font-size: clamp(30px, 5vw, 52px); font-weight: 900; letter-spacing: -2px; color: var(--ink); margin-bottom: 16px; line-height: 1.1; }
.cta-p { font-size: 17px; color: var(--ink3); max-width: 460px; margin: 0 auto 40px; line-height: 1.65; }
.cta-note { font-size: 12.5px; color: var(--ink4); margin-top: 14px; }

/* ── FOOTER ── */
.footer { background: var(--ink2); padding: 48px; }
.footer-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr repeat(3,auto); gap: 48px; margin-bottom: 40px; }
.footer-brand-logo { height: 32px; width: 96px; object-fit: contain; display: block; filter: brightness(10); opacity: .9; margin-bottom: 14px; }
.footer-brand-desc { font-size: 13px; color: rgba(255,255,255,.4); line-height: 1.65; max-width: 220px; }
.footer-col-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.3); margin-bottom: 14px; }
.footer-col a { display: block; font-size: 13.5px; color: rgba(255,255,255,.55); text-decoration: none; margin-bottom: 10px; transition: color .15s; }
.footer-col a:hover { color: #fff; }
.footer-bottom { border-top: 1px solid rgba(255,255,255,.08); padding-top: 24px; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: rgba(255,255,255,.3); flex-wrap: wrap; gap: 8px; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .nav-links { display: none; }
  .nav { padding: 0 24px; }
  .features-grid { grid-template-columns: repeat(2,1fr); }
  .use-grid { grid-template-columns: repeat(2,1fr); }
  .plans-grid { grid-template-columns: repeat(2,1fr); }
  .api-inner { grid-template-columns: 1fr; }
  .how-steps { grid-template-columns: 1fr; }
  .how-steps::before { display: none; }
  .browser-body { grid-template-columns: 1fr; }
  .mock-sidebar { display: none; }
  .footer-inner { grid-template-columns: 1fr 1fr; }
  .stats-inner { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 600px) {
  .features-grid { grid-template-columns: 1fr; }
  .use-grid { grid-template-columns: 1fr; }
  .plans-grid { grid-template-columns: 1fr; }
  .footer-inner { grid-template-columns: 1fr; }
}
</style>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#173967"/>
</head>
<body>
<div id="gate" style="min-height:100vh;display:grid;place-items:center;background:var(--page-bg)">
  <div style="text-align:center;max-width:380px;padding:40px 24px">
    <img src="/assets/pa-logo.svg" alt="" style="height:40px;width:auto;object-fit:contain;margin:0 auto 24px;display:block;border-radius:8px"/>
    <div id="gateContent"></div>
  </div>
</div>
<script src="/js/config.js"></script>
<script>
(function(){
  // Already logged in - go straight to dashboard
  if (Session.valid()) { location.replace('/dashboard'); return; }
  // Not logged in - show minimal sign-in prompt, no product details
  document.getElementById('gateContent').innerHTML =
    '<h1 style="font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.3px;margin-bottom:8px">Prudent PDF</h1>' +
    '<p style="font-size:14px;color:var(--ink3);margin-bottom:24px">Sign in to access your account.</p>' +
    '<a href="/login" style="display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:11px 28px;border-radius:8px;text-decoration:none">Sign in</a>';
  document.title = 'Prudent PDF';
})();
</script>

</html>
